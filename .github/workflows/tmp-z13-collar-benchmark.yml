name: Temporary Z13 collar benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-z13-collar-benchmark.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio shapely mapbox-vector-tile
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build Priority Flood
        run: |
          mkdir -p build tmp/collar
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_quantized.cpp \
            -o build/priority_flood_quantized

      - name: Generate coverage plan
        run: |
          python scripts/coverage_planner.py \
            --bbox=2.5,51.2,5.5,53.2 \
            --output-dir tmp/collar/coverage \
            --coverage-zoom 8 \
            --cache-dir cache \
            --workers 12

          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(
              Path("tmp/collar/coverage/plan.json").read_text()
          )
          ahn = [
              item
              for item in plan["sources"]
              if item["source"] == "nlahn5lowresfilled"
          ]
          assert len(ahn) == 1, ahn
          assert ahn[0]["recommended_processing_zoom"] == 13
          print(json.dumps(ahn[0], indent=2))
          PY

      - name: Download ocean polygons
        run: |
          mkdir -p cache tmp/ocean-source
          curl -fL --retry 3 --retry-delay 5 \
            -o cache/water-polygons-split-3857.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip \
            '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg' \
            -d tmp/ocean-source

      - name: Build Z11 parent
        run: |
          set -euo pipefail
          mkdir -p tmp/collar/base

          python scripts/prepare_phase1a_dem.py \
            --config config/north_sea_pilot.json \
            --cache-dir cache \
            --work-dir tmp/collar/base \
            --workers 12

          eval "$(
            python - tmp/collar/base/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(grid[key]))}")
          PY
          )"

          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          ogr2ogr \
            -f GPKG \
            tmp/collar/base/ocean_clip.gpkg \
            "$SHP" \
            -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -spat_srs EPSG:3857

          gdal_rasterize \
            -burn 1 \
            -init 0 \
            -ot Byte \
            -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
            tmp/collar/base/ocean_clip.gpkg \
            tmp/collar/base/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py \
            --grid tmp/collar/base/grid.json \
            --input tmp/collar/base/ocean_mask.tif \
            --output tmp/collar/base/sea_mask.u8

          build/priority_flood_quantized \
            --elevation tmp/collar/base/elevation.f32 \
            --sea-mask tmp/collar/base/sea_mask.u8 \
            --output tmp/collar/base/threshold.u8 \
            --width "$GRID_WIDTH" \
            --height "$GRID_HEIGHT" \
            --levels "$(python scripts/threshold_levels.py --csv)" \
            --connectivity 4

      - name: Benchmark collars
        run: |
          set -euo pipefail
          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          LEVELS="$(python scripts/threshold_levels.py --csv)"
          mkdir -p tmp/collar/results

          run_variant() {
            LABEL="$1"
            COLLAR_M="$2"
            ROOT="tmp/collar/$LABEL"
            WORK="$ROOT/work"
            RESULT="tmp/collar/results/$LABEL"

            mkdir -p "$ROOT" "$WORK" "$RESULT"

            python scripts/prepare_refinement_region.py \
              --sources-geojson tmp/collar/coverage/sources-context.geojson \
              --source nlahn5lowresfilled \
              --parent-grid tmp/collar/base/grid.json \
              --fine-zoom 13 \
              --halo-projected-m 9783.93962050256 \
              --transition-buffer-projected-m "$COLLAR_M" \
              --output-config "$ROOT/config.json" \
              --output-core "$ROOT/core.geojson"

            cp "$ROOT/config.report.json" "$RESULT/refinement-report.json"

            /usr/bin/time -v \
              python scripts/prepare_phase1a_dem.py \
              --config "$ROOT/config.json" \
              --cache-dir cache \
              --work-dir "$WORK" \
              --workers 12 \
              2>&1 | tee "$RESULT/dem.log"

            eval "$(
              python - "$WORK/grid.json" <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(grid[key]))}")
          PY
            )"

            ogr2ogr \
              -f GPKG \
              "$WORK/ocean_clip.gpkg" \
              "$SHP" \
              -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
              -spat_srs EPSG:3857

            gdal_rasterize \
              -burn 1 \
              -init 0 \
              -ot Byte \
              -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
              -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
              "$WORK/ocean_clip.gpkg" \
              "$WORK/ocean_mask.tif"

            python scripts/write_ocean_mask_raw.py \
              --grid "$WORK/grid.json" \
              --input "$WORK/ocean_mask.tif" \
              --output "$WORK/sea_mask.u8" \
              --allow-empty-sea

            python scripts/build_refinement_boundary.py \
              --coarse-grid tmp/collar/base/grid.json \
              --coarse-threshold tmp/collar/base/threshold.u8 \
              --fine-grid "$WORK/grid.json" \
              --output "$WORK/boundary.u8"

            cp "$WORK/boundary.report.json" "$RESULT/boundary-report.json"

            /usr/bin/time -v \
              build/priority_flood_quantized \
              --elevation "$WORK/elevation.f32" \
              --sea-mask "$WORK/sea_mask.u8" \
              --boundary-threshold "$WORK/boundary.u8" \
              --output "$WORK/threshold.u8" \
              --width "$GRID_WIDTH" \
              --height "$GRID_HEIGHT" \
              --levels "$LEVELS" \
              --connectivity 4 \
              2>&1 | tee "$RESULT/flood.log"

            python scripts/compare_refinement_seam.py \
              --base-grid tmp/collar/base/grid.json \
              --base-threshold tmp/collar/base/threshold.u8 \
              --fine-grid "$WORK/grid.json" \
              --fine-threshold "$WORK/threshold.u8" \
              --core-geojson "$ROOT/core.geojson" \
              --output "$RESULT/seam-report.json"

            python - "$LABEL" "$COLLAR_M" "$RESULT/seam-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          label = sys.argv[1]
          collar = float(sys.argv[2])
          report = json.loads(Path(sys.argv[3]).read_text())
          seam = report[
              "refinement_seam_slider_disagreement_vs_upsampled_base"
          ]
          print(json.dumps({
              "label": label,
              "collar_projected_m": collar,
              "maximum": seam["maximum"],
              "bands": seam["bands"],
          }, indent=2))
          PY

            rm -rf "$WORK"
          }

          run_variant collar-4.9km 4891.96981025128
          run_variant collar-9.8km 9783.93962050256

      - name: Compare collar results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = {
              "label": "collar-2.45km",
              "collar_projected_m": 2445.98490512564,
              "maximum": {
                  "different_pct": 6.388878,
                  "at_level_m": 5.0,
              },
              "bands": {
                  "0-2m": {
                      "max_different_pct": 0.007176,
                      "at_level_m": 1.6,
                  },
                  "2-5m": {
                      "max_different_pct": 6.388878,
                      "at_level_m": 5.0,
                  },
                  "5-20m": {
                      "max_different_pct": 0.144831,
                      "at_level_m": 14.0,
                  },
                  "20-70m": {
                      "max_different_pct": 0.099164,
                      "at_level_m": 30.0,
                  },
              },
          }

          rows = [baseline]
          for label in ("collar-4.9km", "collar-9.8km"):
              report = json.loads(
                  Path(
                      f"tmp/collar/results/{label}/seam-report.json"
                  ).read_text()
              )
              seam = report[
                  "refinement_seam_slider_disagreement_vs_upsampled_base"
              ]
              refinement = json.loads(
                  Path(
                      f"tmp/collar/results/{label}/refinement-report.json"
                  ).read_text()
              )
              rows.append({
                  "label": label,
                  "collar_projected_m": (
                      refinement["transition_buffer_projected_m"]
                  ),
                  "work_tile_count": refinement["work_tile_count"],
                  "maximum": seam["maximum"],
                  "bands": seam["bands"],
              })

          output = {
              "benchmark": "z13-transition-collar",
              "rows": rows,
          }
          Path("tmp/collar/results/summary.json").write_text(
              json.dumps(output, indent=2) + "\n"
          )
          print(json.dumps(output, indent=2))
          PY

      - name: Upload collar benchmark
        uses: actions/upload-artifact@v4
        with:
          name: z13-collar-benchmark
          path: tmp/collar/results
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-z13-collar-benchmark.yml
          git commit -m "Remove temporary Z13 collar benchmark"
          git push
