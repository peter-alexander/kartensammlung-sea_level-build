name: Temporary Z14 Z15 convergence benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-z14-z15-benchmark.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio

          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build solvers
        run: |
          mkdir -p build tmp/convergence

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic             src/priority_flood_quantized.cpp             -o build/priority_flood_quantized

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic             src/candidate_mask_70.cpp             -o build/candidate_mask_70

      - name: Preflight
        run: |
          python - <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from grid import grid_from_config

          gib = 1024 ** 3
          free_disk = shutil.disk_usage(".").free

          rows = {}
          for zoom in (14, 15):
              config = json.loads(
                  Path(
                      f"config/resolution_benchmark_z{zoom}.json"
                  ).read_text()
              )
              grid = grid_from_config(config)
              cells = int(grid["cells"])
              rows[str(zoom)] = {
                  "width": grid["width"],
                  "height": grid["height"],
                  "cells": cells,
                  "raw_working_set_gib": round(
                      cells * 6.25 / gib,
                      3,
                  ),
              }

          print(json.dumps({
              "runs": rows,
              "free_disk_gib": round(free_disk / gib, 3),
          }, indent=2))

          z15_cells = rows["15"]["cells"]
          if z15_cells >= 2 ** 32:
              raise RuntimeError(
                  "Z15 überschreitet die uint32-Grenze des aktuellen Flood-Kerns."
              )

          # elevation.f32 + sea mask + threshold + candidate bitset
          # plus großzügige Reserve für TIFF/GDAL-Zwischenprodukte.
          if z15_cells * 7.5 + 3 * gib > free_disk:
              raise RuntimeError(
                  "Zu wenig Runner-Disk für den Z15-Benchmark."
              )
          PY

          df -h .
          cat /proc/meminfo | head

      - name: Download ocean polygons
        run: |
          mkdir -p cache tmp/ocean-source

          curl -fL --retry 3 --retry-delay 5             -o cache/water-polygons-split-3857.zip             https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip             '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg'             -d tmp/ocean-source

      - name: Build Z14 and Z15
        run: |
          set -euo pipefail

          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          test -n "$SHP"
          LEVELS="$(python scripts/threshold_levels.py --csv)"

          for Z in 14 15; do
            ROOT="tmp/convergence/z$Z"
            CONFIG="config/resolution_benchmark_z$Z.json"
            mkdir -p "$ROOT"

            /usr/bin/time -v               python scripts/prepare_phase1a_dem.py               --config "$CONFIG"               --cache-dir cache               --work-dir "$ROOT"               --workers 12               2>&1 | tee "$ROOT/dem.log"

            eval "$(
              python - "$ROOT/grid.json" <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(g[key]))}")
          PY
            )"

            ogr2ogr               -f GPKG               "$ROOT/ocean_clip.gpkg"               "$SHP"               -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"               -spat_srs EPSG:3857

            gdal_rasterize               -burn 1               -init 0               -ot Byte               -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"               -ts "$GRID_WIDTH" "$GRID_HEIGHT"               -co COMPRESS=DEFLATE               -co TILED=YES               "$ROOT/ocean_clip.gpkg"               "$ROOT/ocean_mask.tif"

            python scripts/write_ocean_mask_raw.py               --grid "$ROOT/grid.json"               --input "$ROOT/ocean_mask.tif"               --output "$ROOT/sea_mask.u8"

            /usr/bin/time -v               build/candidate_mask_70               --elevation "$ROOT/elevation.f32"               --sea-mask "$ROOT/sea_mask.u8"               --output "$ROOT/candidate-70.bit"               --report "$ROOT/candidate-70.json"               --width "$GRID_WIDTH"               --height "$GRID_HEIGHT"               --max-level 70               2>&1 | tee "$ROOT/candidate.log"

            /usr/bin/time -v               build/priority_flood_quantized               --elevation "$ROOT/elevation.f32"               --sea-mask "$ROOT/sea_mask.u8"               --output "$ROOT/threshold.u8"               --width "$GRID_WIDTH"               --height "$GRID_HEIGHT"               --levels "$LEVELS"               --connectivity 4               2>&1 | tee "$ROOT/flood.log"
          done

      - name: Compare Z14 with Z15
        run: |
          python scripts/compare_resolution_pair.py             --coarse tmp/convergence/z14             --fine tmp/convergence/z15             --output tmp/convergence/report.json

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("tmp/convergence/report.json").read_text()
          )
          candidates = {
              str(z): json.loads(
                  Path(
                      f"tmp/convergence/z{z}/candidate-70.json"
                  ).read_text()
              )
              for z in (14, 15)
          }

          summary = {
              "comparison": report["comparison"],
              "z14": report["coarse"],
              "z15": report["fine"],
              "candidate_70": candidates,
          }
          Path("tmp/convergence/summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )

          print(json.dumps({
              "z14_ground_pixel_m": report[
                  "coarse"
              ]["ground_pixel_m_approx"],
              "z15_ground_pixel_m": report[
                  "fine"
              ]["ground_pixel_m_approx"],
              "max_slider_state_disagreement": report[
                  "comparison"
              ]["max_slider_state_disagreement"],
              "z14_samples": report["coarse"]["sample_points"],
              "z15_samples": report["fine"]["sample_points"],
          }, indent=2))
          PY

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: z14-z15-convergence-benchmark
          path: |
            tmp/convergence/report.json
            tmp/convergence/summary.json
            tmp/convergence/z14/grid.json
            tmp/convergence/z14/sea_mask.report.json
            tmp/convergence/z14/candidate-70.json
            tmp/convergence/z14/dem.log
            tmp/convergence/z14/candidate.log
            tmp/convergence/z14/flood.log
            tmp/convergence/z15/grid.json
            tmp/convergence/z15/sea_mask.report.json
            tmp/convergence/z15/candidate-70.json
            tmp/convergence/z15/dem.log
            tmp/convergence/z15/candidate.log
            tmp/convergence/z15/flood.log
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-z14-z15-benchmark.yml ]; then
            git rm .github/workflows/tmp-z14-z15-benchmark.yml
            git commit -m "Remove temporary Z14 Z15 benchmark workflow"
            git pull --rebase
            git push
          fi
