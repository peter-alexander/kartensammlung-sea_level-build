name: Temporary coverage planner v3 check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-coverage-planner-v3-check.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy shapely mapbox-vector-tile

      - name: Check western Netherlands plan
        run: |
          python scripts/coverage_planner.py \
            --bbox=2.5,51.2,5.5,53.2 \
            --output-dir tmp/coverage-v3 \
            --coverage-zoom 8 \
            --cache-dir cache \
            --workers 12

          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(
              Path("tmp/coverage-v3/plan.json").read_text()
          )
          assert plan["schema_version"] == 3

          ahn = [
              item
              for item in plan["sources"]
              if item["source"] == "nlahn5lowresfilled"
          ]
          assert len(ahn) == 1, ahn

          item = ahn[0]
          assert float(item["resolution_m"]) == 5.0, item
          assert item["automatic_tier"] == 2, item
          assert item["recommended_target_ground_resolution_m"] == 6.0, item
          assert item["recommended_processing_zoom"] == 13, item
          assert item["requires_z13_plus"] is True, item

          print(json.dumps(item, indent=2))
          PY

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: coverage-planner-v3-western-netherlands
          path: tmp/coverage-v3/plan.json
          retention-days: 7

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-coverage-planner-v3-check.yml
          git commit -m "Remove temporary coverage planner v3 check"
          git push
