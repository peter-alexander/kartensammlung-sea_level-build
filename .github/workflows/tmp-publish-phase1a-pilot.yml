name: Temporary publish Phase 1A pilot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-publish-phase1a-pilot.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified Phase 1A artifact
        uses: actions/download-artifact@v4
        with:
          name: phase-1a-western-netherlands
          path: tmp/artifact
          github-token: ${{ github.token }}
          run-id: 33420281542

      - name: Prepare versioned pilot output
        run: |
          mkdir -p output/phase1a
          cp tmp/artifact/sea-level-threshold.pmtiles \
            output/phase1a/sea-level-threshold.pmtiles
          cp tmp/artifact/pmtiles-header.json \
            output/phase1a/pmtiles-header.json
          cp tmp/artifact/pmtiles-metadata.json \
            output/phase1a/pmtiles-metadata.json
          cp tmp/artifact/pyramid-report.json \
            output/phase1a/pyramid-report.json

          cat > output/phase1a/manifest.json <<'JSON'
          {
            "build": "phase-1a-western-netherlands",
            "created": "2026-08-31",
            "bounds": [2.5, 51.2, 5.5, 53.2],
            "minzoom": 6,
            "maxzoom": 11,
            "threshold_min_m": 0,
            "threshold_max_m": 100,
            "threshold_step_m": 1,
            "sentinel": 101,
            "connectivity": 4,
            "dem": "Mapterhorn",
            "ocean_mask": "OpenStreetMap water polygons",
            "pyramid": "stratified-nearest-bayer-2x2",
            "pmtiles": "sea-level-threshold.pmtiles"
          }
          JSON

      - name: Commit pilot output and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/phase1a
          git rm .github/workflows/tmp-publish-phase1a-pilot.yml
          git commit -m "Publish Phase 1A sea-level pilot PMTiles"
          git push
