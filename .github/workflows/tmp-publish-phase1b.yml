name: Temporary publish Phase 1B

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-publish-phase1b.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified Phase 1B artifact
        uses: actions/download-artifact@v4
        with:
          name: phase-1b-north-sea
          path: tmp/artifact
          github-token: ${{ github.token }}
          run-id: 33422547699

      - name: Prepare versioned Phase 1B output
        run: |
          mkdir -p output/phase1b
          cp tmp/artifact/sea-level-threshold.pmtiles \
            output/phase1b/sea-level-threshold.pmtiles
          cp tmp/artifact/pmtiles-header.json \
            output/phase1b/pmtiles-header.json
          cp tmp/artifact/pmtiles-metadata.json \
            output/phase1b/pmtiles-metadata.json
          cp tmp/artifact/pyramid-report.json \
            output/phase1b/pyramid-report.json
          cp tmp/artifact/qa/report.json \
            output/phase1b/qa-report.json

          cat > output/phase1b/manifest.json <<'JSON'
          {
            "build": "phase-1b-north-sea-scale-test",
            "created": "2026-08-31",
            "bounds": [-2.5, 49.5, 13.0, 58.0],
            "minzoom": 5,
            "maxzoom": 10,
            "processing_ground_resolution_m_approx": 45.2,
            "threshold_min_m": 0,
            "threshold_max_m": 100,
            "threshold_step_m": 1,
            "sentinel": 101,
            "connectivity": 4,
            "dem": "Mapterhorn",
            "ocean_mask": "OpenStreetMap water polygons",
            "pyramid": "stratified-nearest-bayer-2x2",
            "pmtiles": "sea-level-threshold.pmtiles"
          }
          JSON

      - name: Commit Phase 1B output and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/phase1b
          git rm .github/workflows/tmp-publish-phase1b.yml
          git commit -m "Publish Phase 1B North Sea PMTiles"
          git push
