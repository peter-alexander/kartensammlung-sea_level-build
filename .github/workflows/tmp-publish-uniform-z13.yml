name: Temporary publish uniform Z13 QA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-publish-uniform-z13.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated artifact
        uses: actions/download-artifact@v5
        with:
          name: uniform-z13-planet-validated
          path: tmp/publish-uniform-z13
          github-token: ${{ github.token }}
          run-id: 33490047467

      - name: Install PMTiles CLI
        run: |
          go install github.com/protomaps/go-pmtiles@latest

      - name: Verify artifact
        run: |
          set -euo pipefail

          PMTILES="tmp/publish-uniform-z13/sea-level-uniform-z13.pmtiles"
          test -f "$PMTILES"

          EXPECTED="ff178fe94f592f92e66d8466184e962eece55532f3bedb1e13d020a50de55225"
          ACTUAL="$(sha256sum "$PMTILES" | awk '{print $1}')"

          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          "$(go env GOPATH)/bin/go-pmtiles" verify "$PMTILES"

      - name: Publish QA stand
        run: |
          set -euo pipefail

          OUT="output/phase1c-uniform-z13"
          SRC="tmp/publish-uniform-z13"

          mkdir -p "$OUT"

          cp "$SRC/sea-level-uniform-z13.pmtiles"             "$OUT/sea-level-threshold.pmtiles"
          cp "$SRC/config.json" "$OUT/config.json"
          cp "$SRC/fallback-report.json" "$OUT/fallback-report.json"
          cp "$SRC/pyramid-report.json" "$OUT/pyramid-report.json"
          cp "$SRC/pmtiles-header.json" "$OUT/pmtiles-header.json"
          cp "$SRC/pmtiles-metadata.json" "$OUT/pmtiles-metadata.json"
          cp "$SRC/sha256.txt" "$OUT/source-sha256.txt"
          cp "$SRC/work/grid.json" "$OUT/grid.json"
          cp "$SRC/work/sea_mask.report.json" "$OUT/sea-mask-report.json"

          printf '%s  %s\n'             "ff178fe94f592f92e66d8466184e962eece55532f3bedb1e13d020a50de55225"             "sea-level-threshold.pmtiles"             > "$OUT/sha256.txt"

          cat > "$OUT/README.md" <<'EOF'
          # Phase 1C – Uniform Z13 QA

          Validierter QA-Stand der uniformen Z13-Processing-Domain für die
          westlichen Niederlande.

          Dieser Build verwendet ein gemeinsames Z13-Processing-Raster und
          einen einzigen Priority Flood über die gesamte Domain. Mapterhorn-Z13
          wird verwendet, wo verfügbar; fehlende Land-Tiles werden aus dem
          Z11–Z12-Ausschnitt von `planet.pmtiles` überzoomt. Verbleibende
          DEM-Lücken wurden gegen die OSM-Ocean-Maske validiert und liegen
          ausschließlich im offenen Meer.

          - Bounds: 2.5, 51.2, 5.5, 53.2
          - Processing-Zoom: Z13
          - Raster: 35.840 × 38.912
          - Zellen: 1.394.606.080
          - Ausgabe: Z6–Z13
          - PMTiles: 39.630.942 Bytes
          - SHA256:
            `ff178fe94f592f92e66d8466184e962eece55532f3bedb1e13d020a50de55225`

          Vollständiger Befund:
          `docs/phase-1c-uniform-z13-result.md`
          EOF

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$OUT"
          git commit -m "Publish uniform Z13 QA dataset"
          git pull --rebase
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-publish-uniform-z13.yml ]; then
            git rm .github/workflows/tmp-publish-uniform-z13.yml
            git commit -m "Remove temporary uniform Z13 publish workflow"
            git pull --rebase
            git push
          fi
