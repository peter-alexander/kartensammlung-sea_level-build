name: Phase 1C hierarchical composite

on:
  workflow_dispatch:

jobs:
  western-netherlands-composite:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio shapely mapbox-vector-tile
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build quantized Priority Flood
        run: |
          mkdir -p build tmp/phase1c
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_quantized.cpp \
            -o build/priority_flood_quantized

      - name: Generate Mapterhorn coverage plan
        run: |
          python scripts/coverage_planner.py \
            --bbox=2.5,51.2,5.5,53.2 \
            --output-dir tmp/phase1c/coverage \
            --coverage-zoom 8 \
            --cache-dir cache \
            --workers 12

          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          plan = json.loads(
              Path("tmp/phase1c/coverage/plan.json").read_text()
          )
          ahn = [
              item
              for item in plan["sources"]
              if item["source"] == "nlahn5lowresfilled"
          ]
          assert len(ahn) == 1, ahn
          item = ahn[0]
          assert item["automatic_tier"] == 2
          assert item["recommended_processing_zoom"] == 13

          fine_zoom = int(item["recommended_processing_zoom"])
          world = 2.0 * math.pi * 6378137.0
          z12_pixel = world / ((2 ** 12) * 512)

          transition_buffer_projected_m = 128 * z12_pixel
          halo_projected_m = 512 * z12_pixel

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"FINE_ZOOM={fine_zoom}\n")
              env.write(
                  "TRANSITION_BUFFER_PROJECTED_M="
                  f"{transition_buffer_projected_m:.12f}\n"
              )
              env.write(
                  "HALO_PROJECTED_M="
                  f"{halo_projected_m:.12f}\n"
              )

          print(json.dumps(item, indent=2))
          print(
              "Physical refinement buffers:",
              {
                  "transition_buffer_projected_m": (
                      transition_buffer_projected_m
                  ),
                  "halo_projected_m": halo_projected_m,
              },
          )
          PY

      - name: Download OSM ocean polygons
        run: |
          mkdir -p cache tmp/ocean-source
          curl -fL --retry 3 --retry-delay 5 \
            -o cache/water-polygons-split-3857.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip \
            '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg' \
            -d tmp/ocean-source

      - name: Prepare Z11 parent DEM
        run: |
          mkdir -p tmp/phase1c/base
          /usr/bin/time -v \
            python scripts/prepare_phase1a_dem.py \
            --config config/north_sea_pilot.json \
            --cache-dir cache \
            --work-dir tmp/phase1c/base \
            --workers 12 \
            2>&1 | tee tmp/phase1c/base/dem.log

      - name: Rasterize parent ocean mask
        run: |
          set -euo pipefail
          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          test -n "$SHP"

          eval "$(
            python - tmp/phase1c/base/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(grid[key]))}")
          PY
          )"

          ogr2ogr \
            -f GPKG \
            tmp/phase1c/base/ocean_clip.gpkg \
            "$SHP" \
            -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -spat_srs EPSG:3857

          gdal_rasterize \
            -burn 1 \
            -init 0 \
            -ot Byte \
            -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
            -co COMPRESS=DEFLATE \
            -co TILED=YES \
            tmp/phase1c/base/ocean_clip.gpkg \
            tmp/phase1c/base/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py \
            --grid tmp/phase1c/base/grid.json \
            --input tmp/phase1c/base/ocean_mask.tif \
            --output tmp/phase1c/base/sea_mask.u8

      - name: Run Z11 parent Priority Flood
        run: |
          eval "$(
            python - tmp/phase1c/base/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path
          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          print(f"WIDTH={shlex.quote(str(grid['width']))}")
          print(f"HEIGHT={shlex.quote(str(grid['height']))}")
          PY
          )"

          /usr/bin/time -v \
            build/priority_flood_quantized \
            --elevation tmp/phase1c/base/elevation.f32 \
            --sea-mask tmp/phase1c/base/sea_mask.u8 \
            --output tmp/phase1c/base/threshold.u8 \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --levels "$(python scripts/threshold_levels.py --csv)" \
            --connectivity 4 \
            2>&1 | tee tmp/phase1c/base/flood.log

      - name: Prepare automatic AHN refinement region
        run: |
          python scripts/prepare_refinement_region.py \
            --sources-geojson tmp/phase1c/coverage/sources-context.geojson \
            --source nlahn5lowresfilled \
            --parent-grid tmp/phase1c/base/grid.json \
            --fine-zoom "$FINE_ZOOM" \
            --halo-projected-m "$HALO_PROJECTED_M" \
            --transition-buffer-projected-m "$TRANSITION_BUFFER_PROJECTED_M" \
            --output-config tmp/phase1c/refinement-config.json \
            --output-core tmp/phase1c/refinement-core.geojson

      - name: Preflight refinement resources
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          report = json.loads(
              Path("tmp/phase1c/refinement-config.report.json").read_text()
          )
          config = json.loads(
              Path("tmp/phase1c/refinement-config.json").read_text()
          )
          base = json.loads(
              Path("tmp/phase1c/base/grid.json").read_text()
          )["grid"]

          tile_size = int(config["dem"]["tile_size"])
          fine_zoom = int(config["dem"]["processing_zoom"])
          parent_zoom = int(report["parent_zoom"])
          fine_cells = int(report["work_tile_count"]) * tile_size * tile_size

          factor = 2 ** (fine_zoom - parent_zoom)
          composite_cells = int(base["cells"]) * factor * factor

          # Gemessen am optimierten 50.331.648-Zellen-Z13-Benchmark.
          flood_bytes_per_cell = (282364 * 1024) / 50331648
          estimated_flood_ram = fine_cells * flood_bytes_per_cell

          # elevation.f32 + sea_mask.u8 + boundary.u8 + threshold.u8.
          estimated_fine_raw_disk = fine_cells * 7
          estimated_composite_disk = composite_cells

          mem_total = 0
          for line in Path("/proc/meminfo").read_text().splitlines():
              if line.startswith("MemTotal:"):
                  mem_total = int(line.split()[1]) * 1024
                  break

          free_disk = shutil.disk_usage(".").free
          gib = 1024 ** 3

          summary = {
              "fine_zoom": fine_zoom,
              "work_tiles": report["work_tile_count"],
              "fine_cells": fine_cells,
              "composite_cells": composite_cells,
              "estimated_flood_ram_gib": round(
                  estimated_flood_ram / gib,
                  3,
              ),
              "estimated_fine_raw_disk_gib": round(
                  estimated_fine_raw_disk / gib,
                  3,
              ),
              "estimated_composite_disk_gib": round(
                  estimated_composite_disk / gib,
                  3,
              ),
              "runner_ram_gib": round(mem_total / gib, 3),
              "runner_free_disk_gib": round(free_disk / gib, 3),
          }
          print(json.dumps(summary, indent=2))

          if fine_cells >= 2 ** 32:
              raise RuntimeError(
                  "Fine-Raster überschreitet die uint32-Zellgrenze."
              )

          if mem_total and estimated_flood_ram * 1.5 > mem_total:
              raise RuntimeError(
                  "Preflight: zu wenig Runner-RAM für den Fine-Flood."
              )

          required_disk = (
              estimated_fine_raw_disk
              + estimated_composite_disk
              + 2 * gib
          )
          if required_disk > free_disk:
              raise RuntimeError(
                  "Preflight: zu wenig freier Runner-Speicherplatz."
              )
          PY

          df -h .

      - name: Prepare refinement DEM
        run: |
          mkdir -p tmp/phase1c/fine
          /usr/bin/time -v \
            python scripts/prepare_phase1a_dem.py \
            --config tmp/phase1c/refinement-config.json \
            --cache-dir cache \
            --work-dir tmp/phase1c/fine \
            --workers 12 \
            2>&1 | tee tmp/phase1c/fine/dem.log

      - name: Rasterize refinement ocean mask
        run: |
          set -euo pipefail
          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          test -n "$SHP"

          eval "$(
            python - tmp/phase1c/fine/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(grid[key]))}")
          PY
          )"

          ogr2ogr \
            -f GPKG \
            tmp/phase1c/fine/ocean_clip.gpkg \
            "$SHP" \
            -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -spat_srs EPSG:3857

          gdal_rasterize \
            -burn 1 \
            -init 0 \
            -ot Byte \
            -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
            -co COMPRESS=DEFLATE \
            -co TILED=YES \
            tmp/phase1c/fine/ocean_clip.gpkg \
            tmp/phase1c/fine/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py \
            --grid tmp/phase1c/fine/grid.json \
            --input tmp/phase1c/fine/ocean_mask.tif \
            --output tmp/phase1c/fine/sea_mask.u8 \
            --allow-empty-sea

      - name: Build inherited Z11 boundary
        run: |
          python scripts/build_refinement_boundary.py \
            --coarse-grid tmp/phase1c/base/grid.json \
            --coarse-threshold tmp/phase1c/base/threshold.u8 \
            --fine-grid tmp/phase1c/fine/grid.json \
            --output tmp/phase1c/fine/boundary.u8

      - name: Run refinement Priority Flood
        run: |
          eval "$(
            python - tmp/phase1c/fine/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path
          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          print(f"WIDTH={shlex.quote(str(grid['width']))}")
          print(f"HEIGHT={shlex.quote(str(grid['height']))}")
          PY
          )"

          /usr/bin/time -v \
            build/priority_flood_quantized \
            --elevation tmp/phase1c/fine/elevation.f32 \
            --sea-mask tmp/phase1c/fine/sea_mask.u8 \
            --boundary-threshold tmp/phase1c/fine/boundary.u8 \
            --output tmp/phase1c/fine/threshold.u8 \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --levels "$(python scripts/threshold_levels.py --csv)" \
            --connectivity 4 \
            2>&1 | tee tmp/phase1c/fine/flood.log

      - name: Merge Base and AHN refinement
        run: |
          /usr/bin/time -v \
            python scripts/build_composite_threshold.py \
            --base-grid tmp/phase1c/base/grid.json \
            --base-threshold tmp/phase1c/base/threshold.u8 \
            --fine-grid tmp/phase1c/fine/grid.json \
            --fine-threshold tmp/phase1c/fine/threshold.u8 \
            --core-geojson tmp/phase1c/refinement-core.geojson \
            --output-dir tmp/phase1c/composite \
            --chunk-rows 128 \
            2>&1 | tee tmp/phase1c/composite.log

      - name: Build composite raster pyramid
        run: |
          /usr/bin/time -v \
            python scripts/build_threshold_pyramid.py \
            --config config/north_sea_pilot.json \
            --grid tmp/phase1c/composite/grid.json \
            --threshold tmp/phase1c/composite/threshold.u8 \
            --output tmp/phase1c/composite.mbtiles \
            --report tmp/phase1c/pyramid-report.json \
            --minzoom 6 \
            2>&1 | tee tmp/phase1c/pyramid.log

      - name: Install PMTiles CLI
        run: |
          go install github.com/protomaps/go-pmtiles@latest

      - name: Convert and verify composite PMTiles
        run: |
          "$(go env GOPATH)/bin/go-pmtiles" convert \
            tmp/phase1c/composite.mbtiles \
            tmp/phase1c/sea-level-composite.pmtiles

          "$(go env GOPATH)/bin/go-pmtiles" verify \
            tmp/phase1c/sea-level-composite.pmtiles

          "$(go env GOPATH)/bin/go-pmtiles" show \
            tmp/phase1c/sea-level-composite.pmtiles \
            --header-json \
            > tmp/phase1c/pmtiles-header.json

          "$(go env GOPATH)/bin/go-pmtiles" show \
            tmp/phase1c/sea-level-composite.pmtiles \
            --metadata \
            > tmp/phase1c/pmtiles-metadata.json

      - name: Show composite result
        run: |
          cat tmp/phase1c/refinement-config.report.json
          cat tmp/phase1c/fine/boundary.report.json
          cat tmp/phase1c/composite/report.json

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("tmp/phase1c/composite/report.json").read_text()
          )
          print("=== Echte Mapterhorn-Source-Seam ===")
          print(json.dumps(
              report["refinement_seam_vs_upsampled_base"],
              indent=2,
          ))
          print("=== Größte echte Source-Seam-Ausreißer ===")
          print(json.dumps(
              report["refinement_seam_top_outliers"][:20],
              indent=2,
          ))
          print("=== Pilot-BBox-Clipping-Rand ===")
          print(json.dumps(
              report["parent_clip_boundary_vs_upsampled_base"],
              indent=2,
          ))
          PY

          du -h \
            tmp/phase1c/sea-level-composite.pmtiles \
            tmp/phase1c/composite/threshold.u8 \
            tmp/phase1c/pyramid-report.json

      - name: Upload Phase 1C results
        uses: actions/upload-artifact@v4
        with:
          name: phase-1c-hierarchical-composite
          path: |
            tmp/phase1c/coverage/plan.json
            tmp/phase1c/coverage/sources.geojson
            tmp/phase1c/coverage/sources-context.geojson
            tmp/phase1c/coverage/tier2.geojson
            tmp/phase1c/refinement-config.json
            tmp/phase1c/refinement-config.report.json
            tmp/phase1c/refinement-core.geojson
            tmp/phase1c/fine/boundary.report.json
            tmp/phase1c/fine/sea_mask.report.json
            tmp/phase1c/base/flood.log
            tmp/phase1c/fine/flood.log
            tmp/phase1c/composite/report.json
            tmp/phase1c/pyramid-report.json
            tmp/phase1c/pmtiles-header.json
            tmp/phase1c/pmtiles-metadata.json
            tmp/phase1c/sea-level-composite.pmtiles
          if-no-files-found: error
          retention-days: 14
