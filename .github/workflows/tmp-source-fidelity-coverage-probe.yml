name: Temporary source fidelity coverage probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-source-fidelity-coverage-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy shapely mapbox-vector-tile

      - name: Probe Mapterhorn coverage
        run: |
          mkdir -p tmp/source-fidelity-probe

          python scripts/coverage_planner.py \
            --bbox=13.694458007812488,45.50249699389712,13.892211914062486,45.6793202356954 \
            --output-dir tmp/source-fidelity-probe \
            --coverage-zoom 8 \
            --coverage-context-tiles 1 \
            --cache-dir cache \
            --workers 12

          cat tmp/source-fidelity-probe/plan.json

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: source-fidelity-coverage-probe
          path: |
            tmp/source-fidelity-probe/plan.json
            tmp/source-fidelity-probe/sources.geojson
            tmp/source-fidelity-probe/sources-context.geojson
          retention-days: 14
          if-no-files-found: error

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-source-fidelity-coverage-probe.yml ]; then
            git rm .github/workflows/tmp-source-fidelity-coverage-probe.yml
            git commit -m "Remove temporary source fidelity coverage probe"
            git pull --rebase
            git push
          fi
