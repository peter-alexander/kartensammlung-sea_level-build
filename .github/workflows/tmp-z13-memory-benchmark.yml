name: Temporary optimized Z13 memory benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-z13-memory-benchmark.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build Priority Flood
        run: |
          mkdir -p build
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_quantized.cpp \
            -o build/priority_flood_quantized

      - name: Download ocean polygons
        run: |
          mkdir -p cache tmp/ocean-source
          curl -fL --retry 3 --retry-delay 5 \
            -o cache/water-polygons-split-3857.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          unzip -j cache/water-polygons-split-3857.zip \
            '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg' \
            -d tmp/ocean-source

      - name: Build Z13 benchmark raster
        run: |
          set -euo pipefail
          WORK="tmp/z13-memory"
          mkdir -p "$WORK"

          /usr/bin/time -v \
            python scripts/prepare_phase1a_dem.py \
            --config config/resolution_benchmark_z13.json \
            --cache-dir cache \
            --work-dir "$WORK" \
            --workers 12 \
            2>&1 | tee "$WORK/dem.log"

          eval "$(
            python - "$WORK/grid.json" <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(grid[key]))}")
          PY
          )"

          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          ogr2ogr \
            -f GPKG \
            "$WORK/ocean_clip.gpkg" \
            "$SHP" \
            -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -spat_srs EPSG:3857

          gdal_rasterize \
            -burn 1 \
            -init 0 \
            -ot Byte \
            -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
            "$WORK/ocean_clip.gpkg" \
            "$WORK/ocean_mask.tif"

          python scripts/write_ocean_mask_raw.py \
            --grid "$WORK/grid.json" \
            --input "$WORK/ocean_mask.tif" \
            --output "$WORK/sea_mask.u8"

          /usr/bin/time -v \
            build/priority_flood_quantized \
            --elevation "$WORK/elevation.f32" \
            --sea-mask "$WORK/sea_mask.u8" \
            --output "$WORK/threshold.u8" \
            --width "$GRID_WIDTH" \
            --height "$GRID_HEIGHT" \
            --levels "$(python scripts/threshold_levels.py --csv)" \
            --connectivity 4 \
            2>&1 | tee "$WORK/flood.log"

      - name: Show resource result
        run: |
          echo "=== DEM ==="
          grep -E 'Elapsed \(wall clock\) time|Maximum resident set size' \
            tmp/z13-memory/dem.log
          echo "=== FLOOD ==="
          grep -E 'Elapsed \(wall clock\) time|Maximum resident set size' \
            tmp/z13-memory/flood.log

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: optimized-z13-memory-benchmark
          path: |
            tmp/z13-memory/grid.json
            tmp/z13-memory/dem.log
            tmp/z13-memory/flood.log
          retention-days: 7

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-z13-memory-benchmark.yml
          git commit -m "Remove temporary Z13 memory benchmark"
          git push
