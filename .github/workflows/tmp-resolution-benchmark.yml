name: Temporary sea-level resolution benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-resolution-benchmark.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build quantized Priority Flood
        run: |
          mkdir -p build
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_quantized.cpp \
            -o build/priority_flood_quantized

      - name: Download OSM ocean polygons
        run: |
          mkdir -p cache tmp/ocean-source
          curl -fL --retry 3 --retry-delay 5 \
            -o cache/water-polygons-split-3857.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          unzip -j cache/water-polygons-split-3857.zip \
            '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg' \
            -d tmp/ocean-source

      - name: Prepare and run Z11 Z12 Z13
        run: |
          set -euo pipefail
          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          test -n "$SHP"

          for Z in 11 12 13; do
            WORK="tmp/resolution/z${Z}"
            CONFIG="config/resolution_benchmark_z${Z}.json"
            mkdir -p "$WORK"

            /usr/bin/time -v \
              python scripts/prepare_phase1a_dem.py \
              --config "$CONFIG" \
              --cache-dir cache \
              --work-dir "$WORK" \
              --workers 12 \
              2>&1 | tee "$WORK/dem.log"

            eval "$(
              python - "$WORK/grid.json" <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(grid[key]))}")
          PY
            )"

            ogr2ogr \
              -f GPKG \
              "$WORK/ocean_clip.gpkg" \
              "$SHP" \
              -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
              -spat_srs EPSG:3857

            gdal_rasterize \
              -burn 1 \
              -init 0 \
              -ot Byte \
              -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
              -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
              -co COMPRESS=DEFLATE \
              -co TILED=YES \
              "$WORK/ocean_clip.gpkg" \
              "$WORK/ocean_mask.tif"

            python scripts/write_ocean_mask_raw.py \
              --grid "$WORK/grid.json" \
              --input "$WORK/ocean_mask.tif" \
              --output "$WORK/sea_mask.u8"

            /usr/bin/time -v \
              build/priority_flood_quantized \
              --elevation "$WORK/elevation.f32" \
              --sea-mask "$WORK/sea_mask.u8" \
              --output "$WORK/threshold.u8" \
              --width "$GRID_WIDTH" \
              --height "$GRID_HEIGHT" \
              --max-level 100 \
              --step 1 \
              --connectivity 4 \
              2>&1 | tee "$WORK/flood.log"
          done

      - name: Compare resolutions
        run: |
          python scripts/compare_resolution_benchmark.py \
            --z11 tmp/resolution/z11 \
            --z12 tmp/resolution/z12 \
            --z13 tmp/resolution/z13 \
            --output tmp/resolution/report.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: sea-level-resolution-benchmark
          path: |
            tmp/resolution/report.json
            tmp/resolution/z11/grid.json
            tmp/resolution/z11/sea_mask.report.json
            tmp/resolution/z11/dem.log
            tmp/resolution/z11/flood.log
            tmp/resolution/z12/grid.json
            tmp/resolution/z12/sea_mask.report.json
            tmp/resolution/z12/dem.log
            tmp/resolution/z12/flood.log
            tmp/resolution/z13/grid.json
            tmp/resolution/z13/sea_mask.report.json
            tmp/resolution/z13/dem.log
            tmp/resolution/z13/flood.log
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-resolution-benchmark.yml
          git commit -m "Remove temporary resolution benchmark workflow"
          git push
