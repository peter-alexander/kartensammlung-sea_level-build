name: Temporary full adaptive component one
# Retry after implicit adaptive domain ID fix.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-full-adaptive-component-one.yml
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Previous run ID to resume from its newest checkpoint
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: write

concurrency:
  group: adaptive-component-one-full
  cancel-in-progress: false

jobs:
  component-one:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          mkdir -p build tmp/component1/{input/coarse,input/plan,ocean,cache,work,output}
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_quantized.cpp \
            -o build/priority_flood_quantized

      - name: Download coarse input
        uses: actions/download-artifact@v4
        with:
          name: safe-coarse-work-regions-factor16
          path: tmp/component1/input/coarse
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33542989761

      - name: Download adaptive plan
        uses: actions/download-artifact@v4
        with:
          name: adaptive-component-one-plan
          path: tmp/component1/input/plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33546168321

      - name: Restore Mapterhorn cache
        id: tile-cache
        uses: actions/cache/restore@v4
        with:
          path: tmp/component1/cache
          key: adaptive-component-one-mapterhorn-v1

      - name: Download ocean polygons
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            -o tmp/component1/water.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          unzip -j tmp/component1/water.zip \
            '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg' \
            -d tmp/component1/ocean

      - name: Plan initial sea domains
        run: |
          SHP="$(find tmp/component1/ocean -name '*.shp' -print -quit)"
          python scripts/plan_adaptive_sea_seeds.py \
            --adaptive-plan tmp/component1/input/plan/adaptive-component-1.json \
            --parent-grid tmp/component1/input/coarse/parent/grid.json \
            --sea-vector "$SHP" \
            --coarse-factor 16 \
            --halo-coarse-cells 1 \
            --output tmp/component1/seed-plan.json

      - name: Prefetch Mapterhorn tiles
        run: |
          python scripts/prefetch_adaptive_mapterhorn.py \
            --adaptive-plan tmp/component1/input/plan/adaptive-component-1.json \
            --parent-grid tmp/component1/input/coarse/parent/grid.json \
            --cache-dir tmp/component1/cache \
            --workers 24 \
            --download \
            --output tmp/component1/prefetch.json

      - name: Save Mapterhorn cache
        if: steps.tile-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tmp/component1/cache
          key: adaptive-component-one-mapterhorn-v1

      - name: Restore checkpoint from failed full run
        if: ${{ github.event_name == 'push' }}
        uses: actions/download-artifact@v4
        with:
          pattern: component1-checkpoint-*
          path: tmp/component1/resume
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33553500181

      - name: Restore requested run checkpoints
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: component1-checkpoint-*
          path: tmp/component1/resume
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Select newest restored checkpoint
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '') }}
        run: |
          checkpoint="$(
            find tmp/component1/resume -name checkpoint.npz -print \
              | sort | tail -n 1
          )"
          test -n "$checkpoint"
          cp "$checkpoint" tmp/component1/checkpoint.npz
          echo "Restored $checkpoint"

      - name: Create chunk command
        run: |
          cat > tmp/component1/run.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          chunk="$1"
          SHP="$(find tmp/component1/ocean -name '*.shp' -print -quit)"
          /usr/bin/time -v python scripts/run_adaptive_work_region_chunk.py \
            --components-report tmp/component1/input/coarse/factor-16/components.json \
            --spans tmp/component1/input/coarse/factor-16/components.rle \
            --parent-grid tmp/component1/input/coarse/parent/grid.json \
            --adaptive-plan tmp/component1/input/plan/adaptive-component-1.json \
            --seed-plan tmp/component1/seed-plan.json \
            --component-id 1 \
            --coarse-factor 16 \
            --sea-vector "$SHP" \
            --cache-dir tmp/component1/cache \
            --work-dir tmp/component1/work \
            --output-dir tmp/component1/output \
            --solver build/priority_flood_quantized \
            --levels "$(python scripts/threshold_levels.py --csv)" \
            --checkpoint tmp/component1/checkpoint.npz \
            --checkpoint-every-runs 500 \
            --max-runs-this-invocation 7500 \
            --max-solver-runs 100000 \
            --status-output "tmp/component1/status-$chunk.json" \
            --final-summary tmp/component1/final-summary.json \
            --github-env "$GITHUB_ENV" \
            2>&1 | tee "tmp/component1/chunk-$chunk.log"
          SH
          chmod +x tmp/component1/run.sh
          echo "DONE=false" >> "$GITHUB_ENV"

      - name: Convergence chunk 01
        if: env.DONE != 'true'
        run: tmp/component1/run.sh 01

      - name: Upload checkpoint 01
        if: ${{ env.DONE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: component1-checkpoint-01
          path: |
            tmp/component1/checkpoint.npz
            tmp/component1/status-01.json
            tmp/component1/chunk-01.log
          retention-days: 14

      - name: Convergence chunk 02
        if: env.DONE != 'true'
        run: tmp/component1/run.sh 02

      - name: Upload checkpoint 02
        if: ${{ env.DONE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: component1-checkpoint-02
          path: |
            tmp/component1/checkpoint.npz
            tmp/component1/status-02.json
            tmp/component1/chunk-02.log
          retention-days: 14

      - name: Convergence chunk 03
        if: env.DONE != 'true'
        run: tmp/component1/run.sh 03

      - name: Upload checkpoint 03
        if: ${{ env.DONE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: component1-checkpoint-03
          path: |
            tmp/component1/checkpoint.npz
            tmp/component1/status-03.json
            tmp/component1/chunk-03.log
          retention-days: 14

      - name: Package completed result
        if: env.DONE == 'true'
        run: |
          tar -czf tmp/component1/component1-thresholds.tar.gz \
            -C tmp/component1/output threshold-domains report.json
          sha256sum tmp/component1/component1-thresholds.tar.gz \
            > tmp/component1/component1-thresholds.tar.gz.sha256
          ls -lh tmp/component1/component1-thresholds.tar.gz

      - name: Upload completed result
        if: env.DONE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-component-one-full
          path: |
            tmp/component1/component1-thresholds.tar.gz
            tmp/component1/component1-thresholds.tar.gz.sha256
            tmp/component1/final-summary.json
            tmp/component1/checkpoint.npz
            tmp/component1/seed-plan.json
            tmp/component1/prefetch.json
          compression-level: 0
          retention-days: 14

      - name: Keep resumable status
        if: env.DONE != 'true'
        run: |
          echo "Component 1 is not converged yet."
          echo "Resume this workflow with resume_run_id=$GITHUB_RUN_ID"

      - name: Remove temporary workflow after success
        if: ${{ success() && env.DONE == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git rm .github/workflows/tmp-full-adaptive-component-one.yml
          git commit -m "Remove temporary full adaptive component one workflow"
          git pull --rebase
          git push
