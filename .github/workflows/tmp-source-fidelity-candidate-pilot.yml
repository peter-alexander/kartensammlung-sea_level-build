name: Temporary source fidelity candidate pilot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-source-fidelity-candidate-pilot.yml

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio shapely mapbox-vector-tile
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build tools
        run: |
          mkdir -p build tmp/source-fidelity-pilot cache tmp/ocean-source

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_quantized.cpp \
            -o build/priority_flood_quantized

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_land_mask.cpp \
            -o build/priority_flood_land_mask

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/candidate_mask_70.cpp \
            -o build/candidate_mask_70

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/candidate_land_components.cpp \
            -o build/candidate_land_components

      - name: Resolve real source fidelity
        run: |
          python scripts/coverage_planner.py \
            --bbox=13.749389648437484,45.6716438522655,13.771362304687484,45.69083283645816 \
            --output-dir tmp/source-fidelity-pilot/coverage \
            --coverage-zoom 8 \
            --coverage-context-tiles 1 \
            --cache-dir cache \
            --workers 12

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("tmp/source-fidelity-pilot")
          plan = json.loads(
              (root / "coverage/plan.json").read_text()
          )
          bounds = plan["bounds"]

          full_coverage = []
          for source in plan["sources"]:
              source_bounds = source.get("coverage_bounds")
              zoom = source.get(
                  "source_fidelity_processing_zoom"
              )
              resolution = source.get("resolution_m")
              if (
                  source_bounds is None
                  or zoom is None
                  or resolution is None
              ):
                  continue

              if all(
                  abs(float(a) - float(b)) <= 1e-9
                  for a, b in zip(source_bounds, bounds)
              ):
                  full_coverage.append(source)

          if not full_coverage:
              raise RuntimeError(
                  "Keine Source deckt die Pilot-Work-Region "
                  "vollständig ab."
              )

          selected = min(
              full_coverage,
              key=lambda item: (
                  float(item["resolution_m"]),
                  str(item["source"]),
              ),
          )
          fine_zoom = int(
              selected["source_fidelity_processing_zoom"]
          )

          config = {
              "name": (
                  "source-fidelity-candidate-pilot-"
                  f"{selected['source']}-z{fine_zoom}"
              ),
              "bounds": {
                  "west": bounds[0],
                  "south": bounds[1],
                  "east": bounds[2],
                  "north": bounds[3],
              },
              "dem": {
                  "provider": "mapterhorn",
                  "tile_endpoint": (
                      "https://tiles.mapterhorn.com/"
                      "{z}/{x}/{y}.webp"
                  ),
                  "processing_zoom": fine_zoom,
                  "tile_size": 512,
                  "encoding": "terrarium",
              },
              "threshold": {
                  "scheme": "piecewise-v2",
                  "min_m": 0,
                  "max_m": 70,
                  "class_count": 58,
                  "connectivity": 4,
                  "sentinel_class": 58,
                  "sentinel_m": 71,
                  "rounding": "ceil-to-next-level",
              },
              "pilot": {
                  "coarse_factor": 16,
                  "coarse_component_id": 13,
                  "coarse_component_rank": 117,
                  "coarse_component_cells": 5,
                  "coarse_component_bbox_cells": [
                      616, 773, 617, 775
                  ],
                  "coarse_halo_cells": 1,
                  "selected_source": selected,
              },
          }

          (root / "config.json").write_text(
              json.dumps(config, indent=2) + "\n"
          )
          (root / "selected-source.json").write_text(
              json.dumps(selected, indent=2) + "\n"
          )

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(
                  f"FINE_ZOOM={fine_zoom}\n"
              )
              env.write(
                  "SELECTED_SOURCE="
                  f"{selected['source']}\n"
              )

          print(json.dumps(selected, indent=2))

          if selected["source"] != "si":
              raise RuntimeError(
                  "Pilot erwartete die slowenische 1-m-Source "
                  f"'si', bekam {selected['source']!r}."
              )
          if float(selected["resolution_m"]) != 1.0:
              raise RuntimeError(
                  "Pilot erwartete 1,0 m native Auflösung."
              )
          if fine_zoom != 16:
              raise RuntimeError(
                  "1-m-Source-Fidelity wird für den Pilot "
                  f"auf Z16 erwartet, bekam Z{fine_zoom}."
              )
          PY

      - name: Prepare source-fidelity DEM
        run: |
          mkdir -p tmp/source-fidelity-pilot/fine

          /usr/bin/time -v \
            python scripts/prepare_phase1a_dem.py \
              --config tmp/source-fidelity-pilot/config.json \
              --cache-dir cache \
              --work-dir tmp/source-fidelity-pilot/fine \
              --workers 12 \
            2>&1 | tee tmp/source-fidelity-pilot/dem.log

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("tmp/source-fidelity-pilot")
          meta = json.loads(
              (root / "fine/grid.json").read_text()
          )
          grid = meta["grid"]

          summary = {
              "zoom": grid["zoom"],
              "width": grid["width"],
              "height": grid["height"],
              "cells": grid["cells"],
              "tile_count": (
                  (grid["x_max"] - grid["x_min"] + 1)
                  * (grid["y_max"] - grid["y_min"] + 1)
              ),
              "requested_missing_tile_count": meta[
                  "dem"
              ]["requested_missing_tile_count"],
              "missing_tile_count": meta[
                  "dem"
              ]["missing_tile_count"],
          }
          print(json.dumps(summary, indent=2))

          if grid["zoom"] != 16:
              raise RuntimeError("Fine-Raster ist nicht Z16.")
          if grid["width"] != 2048:
              raise RuntimeError(
                  f"Erwartete Breite 2048, bekam {grid['width']}."
              )
          if grid["height"] != 2560:
              raise RuntimeError(
                  f"Erwartete Höhe 2560, bekam {grid['height']}."
              )
          if summary["tile_count"] != 20:
              raise RuntimeError(
                  "Pilot sollte exakt 20 Z16-Tiles umfassen."
              )
          if summary["missing_tile_count"] != 0:
              raise RuntimeError(
                  "Source-Fidelity-Pilot hat fehlende DEM-Tiles."
              )
          PY

      - name: Prepare ocean mask
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            -o cache/water-polygons-split-3857.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip \
            '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg' \
            -d tmp/ocean-source

          eval "$(
            python - tmp/source-fidelity-pilot/fine/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(
              Path(sys.argv[1]).read_text()
          )["grid"]

          for key in (
              "left",
              "bottom",
              "right",
              "top",
              "width",
              "height",
          ):
              print(
                  f"GRID_{key.upper()}="
                  f"{shlex.quote(str(grid[key]))}"
              )
          PY
          )"

          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          test -n "$SHP"

          ogr2ogr \
            -f GPKG \
            tmp/source-fidelity-pilot/fine/ocean_clip.gpkg \
            "$SHP" \
            -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -spat_srs EPSG:3857

          gdal_rasterize \
            -burn 1 \
            -init 0 \
            -ot Byte \
            -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
            -co COMPRESS=DEFLATE \
            -co TILED=YES \
            tmp/source-fidelity-pilot/fine/ocean_clip.gpkg \
            tmp/source-fidelity-pilot/fine/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py \
            --grid tmp/source-fidelity-pilot/fine/grid.json \
            --input tmp/source-fidelity-pilot/fine/ocean_mask.tif \
            --output tmp/source-fidelity-pilot/fine/sea_mask.u8

      - name: Build global Z16 reference
        run: |
          eval "$(
            python - tmp/source-fidelity-pilot/fine/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(
              Path(sys.argv[1]).read_text()
          )["grid"]
          print(
              "WIDTH="
              + shlex.quote(str(grid["width"]))
          )
          print(
              "HEIGHT="
              + shlex.quote(str(grid["height"]))
          )
          PY
          )"

          /usr/bin/time -v \
            build/priority_flood_quantized \
              --elevation tmp/source-fidelity-pilot/fine/elevation.f32 \
              --sea-mask tmp/source-fidelity-pilot/fine/sea_mask.u8 \
              --output tmp/source-fidelity-pilot/fine/reference.u8 \
              --width "$WIDTH" \
              --height "$HEIGHT" \
              --levels "$(python scripts/threshold_levels.py --csv)" \
              --connectivity 4 \
            2>&1 | tee tmp/source-fidelity-pilot/reference.log

      - name: Build exact Z16 candidate components
        run: |
          eval "$(
            python - tmp/source-fidelity-pilot/fine/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(
              Path(sys.argv[1]).read_text()
          )["grid"]
          print(
              "WIDTH="
              + shlex.quote(str(grid["width"]))
          )
          print(
              "HEIGHT="
              + shlex.quote(str(grid["height"]))
          )
          PY
          )"

          /usr/bin/time -v \
            build/candidate_mask_70 \
              --elevation tmp/source-fidelity-pilot/fine/elevation.f32 \
              --sea-mask tmp/source-fidelity-pilot/fine/sea_mask.u8 \
              --output tmp/source-fidelity-pilot/fine/candidate.bit \
              --report tmp/source-fidelity-pilot/fine/candidate.json \
              --width "$WIDTH" \
              --height "$HEIGHT" \
              --max-level 70 \
            2>&1 | tee tmp/source-fidelity-pilot/candidate.log

          /usr/bin/time -v \
            build/candidate_land_components \
              --candidate-mask tmp/source-fidelity-pilot/fine/candidate.bit \
              --sea-mask tmp/source-fidelity-pilot/fine/sea_mask.u8 \
              --report tmp/source-fidelity-pilot/fine/components.json \
              --spans-output tmp/source-fidelity-pilot/fine/components.rle \
              --width "$WIDTH" \
              --height "$HEIGHT" \
            2>&1 | tee tmp/source-fidelity-pilot/components.log

      - name: Process exact components serially
        run: |
          eval "$(
            python - tmp/source-fidelity-pilot/fine/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(
              Path(sys.argv[1]).read_text()
          )["grid"]
          print(
              "WIDTH="
              + shlex.quote(str(grid["width"]))
          )
          print(
              "HEIGHT="
              + shlex.quote(str(grid["height"]))
          )
          PY
          )"

          /usr/bin/time -v \
            python scripts/process_candidate_components.py \
              --components-report tmp/source-fidelity-pilot/fine/components.json \
              --spans tmp/source-fidelity-pilot/fine/components.rle \
              --elevation tmp/source-fidelity-pilot/fine/elevation.f32 \
              --sea-mask tmp/source-fidelity-pilot/fine/sea_mask.u8 \
              --output tmp/source-fidelity-pilot/fine/serial.u8 \
              --work-dir tmp/source-fidelity-pilot/fine/component-work \
              --solver build/priority_flood_land_mask \
              --levels "$(python scripts/threshold_levels.py --csv)" \
              --global-width "$WIDTH" \
              --global-height "$HEIGHT" \
              --halo 1 \
              --max-direct-window-cells 1000000 \
              --domain-solver build/priority_flood_quantized \
              --domain-width 1024 \
              --domain-height 1024 \
            2>&1 | tee tmp/source-fidelity-pilot/serial.log

      - name: Compare source-fidelity result
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          import numpy as np

          root = Path("tmp/source-fidelity-pilot")
          grid = json.loads(
              (root / "fine/grid.json").read_text()
          )["grid"]
          shape = (
              int(grid["height"]),
              int(grid["width"]),
          )
          cells = int(grid["cells"])

          sea = np.memmap(
              root / "fine/sea_mask.u8",
              dtype=np.uint8,
              mode="r",
              shape=shape,
          )

          packed = np.fromfile(
              root / "fine/candidate.bit",
              dtype=np.uint8,
          )
          candidate = np.unpackbits(
              packed,
              bitorder="little",
          )[:cells].reshape(shape).astype(bool)
          candidate_land = candidate & (sea == 0)

          reference = np.memmap(
              root / "fine/reference.u8",
              dtype=np.uint8,
              mode="r",
              shape=shape,
          )
          serial = np.memmap(
              root / "fine/serial.u8",
              dtype=np.uint8,
              mode="r",
              shape=shape,
          )

          levels = (
              __import__("subprocess")
              .check_output(
                  [
                      "python",
                      "scripts/threshold_levels.py",
                      "--csv",
                  ],
                  text=True,
              )
              .strip()
              .split(",")
          )
          sentinel = len(levels)

          differing = int(
              np.count_nonzero(
                  serial[candidate_land]
                  != reference[candidate_land]
              )
          )
          outside_non_sentinel = int(
              np.count_nonzero(
                  serial[~candidate_land]
                  != sentinel
              )
          )

          if differing:
              raise AssertionError(
                  f"{differing} Candidate-Landzellen "
                  "unterscheiden sich vom globalen Z16-Referenzlauf."
              )
          if outside_non_sentinel:
              raise AssertionError(
                  f"{outside_non_sentinel} Zellen außerhalb "
                  "Candidate-Land sind nicht Sentinel."
              )

          components = json.loads(
              (root / "fine/components.json").read_text()
          )
          candidate_report = json.loads(
              (root / "fine/candidate.json").read_text()
          )

          serial_text = (
              root / "serial.log"
          ).read_text()
          json_start = serial_text.rfind("\n{")
          if json_start < 0:
              json_start = serial_text.find("{")
          else:
              json_start += 1
          serial_report = json.loads(
              serial_text[json_start:]
          )

          def time_stats(path):
              text = Path(path).read_text()
              peak = re.search(
                  r"Maximum resident set size \(kbytes\):\s*(\d+)",
                  text,
              )
              elapsed = re.search(
                  r"Elapsed \(wall clock\) time "
                  r"\(h:mm:ss or m:ss\):\s*([^\n]+)",
                  text,
              )
              return {
                  "peak_rss_kb": (
                      int(peak.group(1))
                      if peak
                      else None
                  ),
                  "elapsed": (
                      elapsed.group(1).strip()
                      if elapsed
                      else None
                  ),
              }

          source = json.loads(
              (root / "selected-source.json").read_text()
          )

          summary = {
              "source": {
                  "source": source["source"],
                  "name": source["name"],
                  "native_resolution_m": (
                      source["resolution_m"]
                  ),
                  "source_fidelity_zoom": (
                      source[
                          "source_fidelity_processing_zoom"
                      ]
                  ),
                  "source_fidelity_ground_resolution_m": (
                      source[
                          "source_fidelity_ground_resolution_m"
                      ]
                  ),
              },
              "grid": {
                  "width": grid["width"],
                  "height": grid["height"],
                  "cells": grid["cells"],
                  "tiles": (
                      (grid["x_max"] - grid["x_min"] + 1)
                      * (grid["y_max"] - grid["y_min"] + 1)
                  ),
              },
              "candidate": candidate_report,
              "components": {
                  "count": components["component_count"],
                  "land_candidate_cells": (
                      components["land_candidate_cells"]
                  ),
                  "largest": (
                      components["components"][0]
                      if components["components"]
                      else None
                  ),
              },
              "serial": serial_report,
              "comparison": {
                  "candidate_land_differing_cells": differing,
                  "outside_candidate_non_sentinel": (
                      outside_non_sentinel
                  ),
                  "byte_equal_on_candidate_land": (
                      differing == 0
                  ),
              },
              "timing": {
                  "reference": time_stats(
                      root / "reference.log"
                  ),
                  "candidate": time_stats(
                      root / "candidate.log"
                  ),
                  "components": time_stats(
                      root / "components.log"
                  ),
                  "serial": time_stats(
                      root / "serial.log"
                  ),
              },
          }

          (root / "summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload pilot results
        uses: actions/upload-artifact@v4
        with:
          name: source-fidelity-candidate-pilot
          path: |
            tmp/source-fidelity-pilot/summary.json
            tmp/source-fidelity-pilot/config.json
            tmp/source-fidelity-pilot/selected-source.json
            tmp/source-fidelity-pilot/coverage/plan.json
            tmp/source-fidelity-pilot/fine/grid.json
            tmp/source-fidelity-pilot/fine/candidate.json
            tmp/source-fidelity-pilot/fine/components.json
            tmp/source-fidelity-pilot/dem.log
            tmp/source-fidelity-pilot/reference.log
            tmp/source-fidelity-pilot/candidate.log
            tmp/source-fidelity-pilot/components.log
            tmp/source-fidelity-pilot/serial.log
          retention-days: 14
          if-no-files-found: error

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-source-fidelity-candidate-pilot.yml ]; then
            git rm .github/workflows/tmp-source-fidelity-candidate-pilot.yml
            git commit -m "Remove temporary source fidelity candidate pilot"
            git pull --rebase
            git push
          fi
