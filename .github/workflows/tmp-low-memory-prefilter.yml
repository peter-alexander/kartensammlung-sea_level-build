name: Temporary low-memory prefilter benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-low-memory-prefilter.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio

          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build candidate tool
        run: |
          mkdir -p build tmp/low-memory-prefilter cache

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic             src/candidate_mask_70.cpp             -o build/candidate_mask_70

      - name: Measure streamed DEM assembly
        run: |
          /usr/bin/time -v             python scripts/prepare_phase1a_dem.py             --config config/candidate_benchmark_north_adriatic_alps_z11.json             --cache-dir cache             --work-dir tmp/low-memory-prefilter             --workers 12             2>&1 | tee tmp/low-memory-prefilter/dem.log

      - name: Prepare ocean mask
        run: |
          mkdir -p tmp/ocean-source

          curl -fL --retry 3 --retry-delay 5             -o cache/water-polygons-split-3857.zip             https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip             '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg'             -d tmp/ocean-source

          eval "$(
            python - tmp/low-memory-prefilter/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(g[key]))}")
          PY
          )"

          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"

          ogr2ogr             -f GPKG             tmp/low-memory-prefilter/ocean_clip.gpkg             "$SHP"             -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"             -spat_srs EPSG:3857

          gdal_rasterize             -burn 1             -init 0             -ot Byte             -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"             -ts "$GRID_WIDTH" "$GRID_HEIGHT"             -co COMPRESS=DEFLATE             -co TILED=YES             tmp/low-memory-prefilter/ocean_clip.gpkg             tmp/low-memory-prefilter/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py             --grid tmp/low-memory-prefilter/grid.json             --input tmp/low-memory-prefilter/ocean_mask.tif             --output tmp/low-memory-prefilter/sea_mask.u8

      - name: Measure streamed factor 16 coarse build
        run: |
          eval "$(
            python - tmp/low-memory-prefilter/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          print(f"GRID_WIDTH={shlex.quote(str(g['width']))}")
          print(f"GRID_HEIGHT={shlex.quote(str(g['height']))}")
          PY
          )"

          /usr/bin/time -v             python scripts/build_conservative_candidate_coarse.py             --elevation tmp/low-memory-prefilter/elevation.f32             --sea-mask tmp/low-memory-prefilter/sea_mask.u8             --output-elevation tmp/low-memory-prefilter/coarse.f32             --output-sea-mask tmp/low-memory-prefilter/coarse-sea.u8             --report tmp/low-memory-prefilter/coarse-report.json             --width "$GRID_WIDTH"             --height "$GRID_HEIGHT"             --factor 16             2>&1 | tee tmp/low-memory-prefilter/coarse-build.log

      - name: Measure coarse candidate pass
        run: |
          eval "$(
            python - tmp/low-memory-prefilter/coarse-report.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          r = json.loads(Path(sys.argv[1]).read_text())
          print(f"COARSE_WIDTH={shlex.quote(str(r['coarse_width']))}")
          print(f"COARSE_HEIGHT={shlex.quote(str(r['coarse_height']))}")
          PY
          )"

          /usr/bin/time -v             build/candidate_mask_70             --elevation tmp/low-memory-prefilter/coarse.f32             --sea-mask tmp/low-memory-prefilter/coarse-sea.u8             --output tmp/low-memory-prefilter/coarse-candidate.bit             --report tmp/low-memory-prefilter/coarse-candidate.json             --width "$COARSE_WIDTH"             --height "$COARSE_HEIGHT"             --max-level 70             2>&1 | tee tmp/low-memory-prefilter/coarse-candidate.log

      - name: Summarize memory
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("tmp/low-memory-prefilter")

          def stats(name):
              text = (root / name).read_text()
              peak = re.search(
                  r"Maximum resident set size \(kbytes\):\s*(\d+)",
                  text,
              )
              elapsed = re.search(
                  r"Elapsed \(wall clock\) time \(h:mm:ss or m:ss\):\s*([^\n]+)",
                  text,
              )
              return {
                  "peak_rss_kb": int(peak.group(1)) if peak else None,
                  "elapsed": elapsed.group(1).strip() if elapsed else None,
              }

          summary = {
              "dem": stats("dem.log"),
              "coarse_build": stats("coarse-build.log"),
              "coarse_candidate": stats("coarse-candidate.log"),
              "coarse_report": json.loads(
                  (root / "coarse-report.json").read_text()
              ),
              "coarse_candidate_report": json.loads(
                  (root / "coarse-candidate.json").read_text()
              ),
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: low-memory-prefilter-benchmark
          path: |
            tmp/low-memory-prefilter/summary.json
            tmp/low-memory-prefilter/coarse-report.json
            tmp/low-memory-prefilter/coarse-candidate.json
            tmp/low-memory-prefilter/dem.log
            tmp/low-memory-prefilter/coarse-build.log
            tmp/low-memory-prefilter/coarse-candidate.log
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-low-memory-prefilter.yml ]; then
            git rm .github/workflows/tmp-low-memory-prefilter.yml
            git commit -m "Remove temporary low-memory prefilter workflow"
            git pull --rebase
            git push
          fi
