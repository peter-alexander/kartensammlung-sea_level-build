name: Temporary safe coarse work regions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-safe-coarse-work-regions.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio Fiona

      - name: Build tools
        run: |
          mkdir -p build tmp/safe-coarse cache tmp/ocean-source

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/candidate_mask_70.cpp \
            -o build/candidate_mask_70

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/candidate_land_components.cpp \
            -o build/candidate_land_components

      - name: Prepare parent Z11 DEM
        run: |
          python scripts/prepare_phase1a_dem.py \
            --config config/candidate_benchmark_north_adriatic_alps_z11.json \
            --cache-dir cache \
            --work-dir tmp/safe-coarse/parent \
            --workers 12

      - name: Prepare parent sea mask
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            -o cache/water-polygons-split-3857.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip \
            '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg' \
            -d tmp/ocean-source

          python - <<'PY'
          import json
          from pathlib import Path

          import fiona
          import numpy as np
          from affine import Affine
          from rasterio.features import rasterize

          root = Path("tmp/safe-coarse")
          grid = json.loads(
              (root / "parent/grid.json").read_text()
          )["grid"]
          shp = next(Path("tmp/ocean-source").glob("*.shp"))
          bounds = (
              float(grid["left"]),
              float(grid["bottom"]),
              float(grid["right"]),
              float(grid["top"]),
          )
          with fiona.open(shp) as source:
              geometries = [
                  feature["geometry"]
                  for feature in source.filter(bbox=bounds)
                  if feature["geometry"] is not None
              ]

          transform = Affine(
              float(grid["resolution"]),
              0.0,
              float(grid["left"]),
              0.0,
              -float(grid["resolution"]),
              float(grid["top"]),
          )
          sea = rasterize(
              ((geometry, 1) for geometry in geometries),
              out_shape=(
                  int(grid["height"]),
                  int(grid["width"]),
              ),
              fill=0,
              transform=transform,
              dtype=np.uint8,
          )
          sea.tofile(root / "parent/sea_mask.u8")
          PY

      - name: Build safe factor 16 components
        run: |
          eval "$(
            python - tmp/safe-coarse/parent/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          print(f"WIDTH={shlex.quote(str(grid['width']))}")
          print(f"HEIGHT={shlex.quote(str(grid['height']))}")
          PY
          )"

          mkdir -p tmp/safe-coarse/factor-16

          python scripts/build_conservative_candidate_coarse.py \
            --elevation tmp/safe-coarse/parent/elevation.f32 \
            --sea-mask tmp/safe-coarse/parent/sea_mask.u8 \
            --output-elevation tmp/safe-coarse/factor-16/elevation.f32 \
            --output-sea-mask tmp/safe-coarse/factor-16/sea-any.u8 \
            --output-pure-sea-mask tmp/safe-coarse/factor-16/sea-all.u8 \
            --report tmp/safe-coarse/factor-16/coarse.json \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --factor 16

          eval "$(
            python - tmp/safe-coarse/factor-16/coarse.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())
          print(
              "COARSE_WIDTH="
              + shlex.quote(str(report["coarse_width"]))
          )
          print(
              "COARSE_HEIGHT="
              + shlex.quote(str(report["coarse_height"]))
          )
          PY
          )"

          build/candidate_mask_70 \
            --elevation tmp/safe-coarse/factor-16/elevation.f32 \
            --sea-mask tmp/safe-coarse/factor-16/sea-any.u8 \
            --output tmp/safe-coarse/factor-16/candidate.bit \
            --report tmp/safe-coarse/factor-16/candidate.json \
            --width "$COARSE_WIDTH" \
            --height "$COARSE_HEIGHT" \
            --max-level 70

          build/candidate_land_components \
            --candidate-mask tmp/safe-coarse/factor-16/candidate.bit \
            --sea-mask tmp/safe-coarse/factor-16/sea-all.u8 \
            --report tmp/safe-coarse/factor-16/components.json \
            --spans-output tmp/safe-coarse/factor-16/components.rle \
            --width "$COARSE_WIDTH" \
            --height "$COARSE_HEIGHT"

      - name: Summarize safe work regions
        run: |
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          root = Path("tmp/safe-coarse")
          report = json.loads(
              (root / "factor-16/components.json").read_text()
          )
          coarse = json.loads(
              (root / "factor-16/coarse.json").read_text()
          )
          spans_path = root / "factor-16/components.rle"

          def contains(component, row, col):
              with spans_path.open("rb") as source:
                  source.seek(
                      int(component["span_offset_records"]) * 12
                  )
                  for _ in range(int(component["span_count"])):
                      raw = source.read(12)
                      span_row, left, right = struct.unpack(
                          "<III",
                          raw,
                      )
                      if span_row == row and left <= col <= right:
                          return True
              return False

          target = next(
              (
                  component
                  for component in report["components"]
                  if contains(component, 798, 608)
              ),
              None,
          )

          sizes = [
              int(component["cells"])
              for component in report["components"]
          ]
          summary = {
              "component_count": int(report["component_count"]),
              "land_candidate_cells": int(
                  report["land_candidate_cells"]
              ),
              "largest_component_cells": int(
                  report["largest_component_cells"]
              ),
              "largest_component_pct": float(
                  report[
                      "largest_component_pct_of_land_candidates"
                  ]
              ),
              "components_le_4_cells": sum(
                  size <= 4 for size in sizes
              ),
              "components_le_16_cells": sum(
                  size <= 16 for size in sizes
              ),
              "components_le_64_cells": sum(
                  size <= 64 for size in sizes
              ),
              "sea_any_cells": int(
                  coarse["sea_coarse_cells"]
              ),
              "pure_sea_cells": int(
                  coarse["pure_sea_coarse_cells"]
              ),
              "old_pilot_cell_component": target,
              "top_20": report["components"][:20],
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))

          if target is None:
              raise RuntimeError(
                  "Die bekannte Grobzelle 608/798 ist in keiner "
                  "sicheren Work Region enthalten."
              )
          PY

      - name: Upload safe work region data
        uses: actions/upload-artifact@v4
        with:
          name: safe-coarse-work-regions-factor16
          path: |
            tmp/safe-coarse/summary.json
            tmp/safe-coarse/parent/grid.json
            tmp/safe-coarse/factor-16/coarse.json
            tmp/safe-coarse/factor-16/candidate.json
            tmp/safe-coarse/factor-16/components.json
            tmp/safe-coarse/factor-16/components.rle
          retention-days: 14
          if-no-files-found: error

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-safe-coarse-work-regions.yml ]; then
            git rm .github/workflows/tmp-safe-coarse-work-regions.yml
            git commit -m "Remove temporary safe coarse work regions"
            git pull --rebase
            git push
          fi
