name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  priority-flood:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio Fiona shapely mapbox-vector-tile pmtiles

      - name: Build quantized Priority Flood
        run: |
          mkdir -p build
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_quantized.cpp \
            -o build/priority_flood_quantized
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/candidate_mask_70.cpp \
            -o build/candidate_mask_70
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/candidate_land_components.cpp \
            -o build/candidate_land_components
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_land_mask.cpp \
            -o build/priority_flood_land_mask

      - name: Run reference comparison
        run: |
          python tests/test_quantized_priority_flood.py
          python tests/test_candidate_mask_70.py
          python tests/test_candidate_land_components.py
          python tests/test_materialize_candidate_component.py
          python tests/test_mask_candidate_to_work_region.py
          python tests/test_process_candidate_components.py
          python tests/test_process_component_domains.py
          python tests/test_process_lazy_domains.py
          python tests/test_process_adaptive_lazy_domains.py
          python tests/test_priority_flood_land_mask.py
          python tests/test_conservative_candidate.py
          python tests/test_threshold_pyramid.py
          python tests/test_refinement_boundary.py
          python tests/test_grid.py
          python tests/test_coverage_planner.py
          python tests/test_prepare_refinement_region.py
          python tests/test_prepare_candidate_work_region.py
          python tests/test_plan_work_region.py
          python tests/test_plan_lazy_work_region_domains.py
          python tests/test_plan_adaptive_work_region_domains.py
          python tests/test_composite_threshold.py
          python tests/test_write_ocean_mask_raw.py
          python tests/test_compare_refinement_seam.py
