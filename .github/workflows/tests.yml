name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  priority-flood:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Build quantized Priority Flood
        run: |
          mkdir -p build
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_quantized.cpp \
            -o build/priority_flood_quantized

      - name: Run reference comparison
        run: |
          python tests/test_quantized_priority_flood.py
