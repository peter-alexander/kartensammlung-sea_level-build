name: Temporary publish Phase 1C V2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-publish-phase1c-v2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated Phase 1C V2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf tmp/phase1c-v2-artifact
          mkdir -p tmp/phase1c-v2-artifact
          gh run download 33441239895 \
            --repo "$GITHUB_REPOSITORY" \
            --name phase-1c-hierarchical-composite \
            --dir tmp/phase1c-v2-artifact

      - name: Publish Phase 1C V2
        run: |
          set -euo pipefail

          OUT="output/phase1c-v2"
          SRC="tmp/phase1c-v2-artifact"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp "$SRC/composite/report.json" "$OUT/composite-report.json"
          cp "$SRC/coverage/plan.json" "$OUT/coverage-plan.json"
          cp "$SRC/refinement-config.json" "$OUT/refinement-config.json"
          cp "$SRC/refinement-config.report.json" "$OUT/refinement-report.json"
          cp "$SRC/fine/boundary.report.json" "$OUT/boundary-report.json"
          cp "$SRC/pyramid-report.json" "$OUT/pyramid-report.json"
          cp "$SRC/pmtiles-header.json" "$OUT/pmtiles-header.json"
          cp "$SRC/pmtiles-metadata.json" "$OUT/pmtiles-metadata.json"
          cp "$SRC/sea-level-composite.pmtiles" "$OUT/sea-level-threshold.pmtiles"

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          out = Path("output/phase1c-v2")
          pmtiles = out / "sea-level-threshold.pmtiles"
          composite = json.loads(
              (out / "composite-report.json").read_text()
          )
          refinement = json.loads(
              (out / "refinement-config.json").read_text()
          )
          header = json.loads(
              (out / "pmtiles-header.json").read_text()
          )

          sha256 = hashlib.sha256(pmtiles.read_bytes()).hexdigest()
          slider_qa = composite[
              "refinement_seam_slider_disagreement_vs_upsampled_base"
          ]

          manifest = {
              "phase": "1C-v2",
              "threshold_schema": refinement["threshold"],
              "source_run_id": 33441239895,
              "source_commit": "9156444474534d8d559e4b4637d1dd302afac3e2",
              "base_zoom": composite["base_zoom"],
              "fine_zoom": composite["fine_zoom"],
              "refinement_source": refinement["refinement"]["source"],
              "transition_buffer_pixels": refinement["refinement"][
                  "transition_buffer_pixels"
              ],
              "pmtiles": {
                  "file": "sea-level-threshold.pmtiles",
                  "bytes": pmtiles.stat().st_size,
                  "sha256": sha256,
                  "minzoom": header["minzoom"],
                  "maxzoom": header["maxzoom"],
                  "bounds": header["bounds"],
              },
              "source_seam_slider_qa": {
                  "count": slider_qa["count"],
                  "maximum": slider_qa["maximum"],
                  "bands": slider_qa["bands"],
              },
          }

          (out / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          test "$(sha256sum "$OUT/sea-level-threshold.pmtiles" | cut -d' ' -f1)" = \
            "e9c6f7d2cb5b9a75981ea6b5f210532dd237fff89c99a3a85e51411e3e1e6e34"
          test "$(stat -c '%s' "$OUT/sea-level-threshold.pmtiles")" = "15125875"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$OUT"
          git rm .github/workflows/tmp-phase1c-v2.yml
          git rm .github/workflows/tmp-publish-phase1c-v2.yml
          git commit -m "Publish Phase 1C V2 composite"
          git push
