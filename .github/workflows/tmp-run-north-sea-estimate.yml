name: Temporary run North Sea estimate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-run-north-sea-estimate.yml

permissions:
  contents: write

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estimate raster
        run: |
          python scripts/estimate_north_sea_pilot.py

      - name: Install PMTiles CLI
        run: |
          go install github.com/protomaps/go-pmtiles@latest
          "$(go env GOPATH)/bin/go-pmtiles" --help >/dev/null

      - name: Mapterhorn extract dry run
        run: |
          "$(go env GOPATH)/bin/go-pmtiles" extract \
            --bbox=2.5,51.2,5.5,53.2 \
            --maxzoom=11 \
            --overfetch=0 \
            --dry-run \
            https://download.mapterhorn.com/planet.pmtiles \
            north-sea-dem.pmtiles

      - name: OSM ocean source headers
        run: |
          curl -fsSIL https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-run-north-sea-estimate.yml
          git commit -m "Remove temporary North Sea estimate workflow"
          git push
