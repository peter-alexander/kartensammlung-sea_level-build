name: Temporary hierarchical candidate components

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-hierarchical-components.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio

          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build tools
        run: |
          mkdir -p build tmp/hierarchical-components cache

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic             src/candidate_mask_70.cpp             -o build/candidate_mask_70

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic             src/candidate_land_components.cpp             -o build/candidate_land_components

      - name: Prepare streamed Z11 DEM
        run: |
          python scripts/prepare_phase1a_dem.py             --config config/candidate_benchmark_north_adriatic_alps_z11.json             --cache-dir cache             --work-dir tmp/hierarchical-components             --workers 12

      - name: Prepare ocean mask
        run: |
          mkdir -p tmp/ocean-source

          curl -fL --retry 3 --retry-delay 5             -o cache/water-polygons-split-3857.zip             https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip             '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg'             -d tmp/ocean-source

          eval "$(
            python - tmp/hierarchical-components/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(g[key]))}")
          PY
          )"

          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"

          ogr2ogr             -f GPKG             tmp/hierarchical-components/ocean_clip.gpkg             "$SHP"             -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"             -spat_srs EPSG:3857

          gdal_rasterize             -burn 1             -init 0             -ot Byte             -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"             -ts "$GRID_WIDTH" "$GRID_HEIGHT"             -co COMPRESS=DEFLATE             -co TILED=YES             tmp/hierarchical-components/ocean_clip.gpkg             tmp/hierarchical-components/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py             --grid tmp/hierarchical-components/grid.json             --input tmp/hierarchical-components/ocean_mask.tif             --output tmp/hierarchical-components/sea_mask.u8

      - name: Build exact and conservative masks
        run: |
          set -euo pipefail

          eval "$(
            python - tmp/hierarchical-components/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          print(f"FINE_WIDTH={shlex.quote(str(g['width']))}")
          print(f"FINE_HEIGHT={shlex.quote(str(g['height']))}")
          PY
          )"

          mkdir -p tmp/hierarchical-components/factor-1

          /usr/bin/time -v             build/candidate_mask_70             --elevation tmp/hierarchical-components/elevation.f32             --sea-mask tmp/hierarchical-components/sea_mask.u8             --output tmp/hierarchical-components/factor-1/candidate.bit             --report tmp/hierarchical-components/factor-1/candidate.json             --width "$FINE_WIDTH"             --height "$FINE_HEIGHT"             --max-level 70             2>&1 | tee tmp/hierarchical-components/factor-1/candidate.log

          /usr/bin/time -v             build/candidate_land_components             --candidate-mask tmp/hierarchical-components/factor-1/candidate.bit             --sea-mask tmp/hierarchical-components/sea_mask.u8             --report tmp/hierarchical-components/factor-1/components.json             --width "$FINE_WIDTH"             --height "$FINE_HEIGHT"             2>&1 | tee tmp/hierarchical-components/factor-1/components.log

          for FACTOR in 2 4 8 16; do
            ROOT="tmp/hierarchical-components/factor-$FACTOR"
            mkdir -p "$ROOT"

            python scripts/build_conservative_candidate_coarse.py               --elevation tmp/hierarchical-components/elevation.f32               --sea-mask tmp/hierarchical-components/sea_mask.u8               --output-elevation "$ROOT/elevation.f32"               --output-sea-mask "$ROOT/sea.u8"               --report "$ROOT/coarse.json"               --width "$FINE_WIDTH"               --height "$FINE_HEIGHT"               --factor "$FACTOR"

            eval "$(
              python - "$ROOT/coarse.json" <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          r = json.loads(Path(sys.argv[1]).read_text())
          print(f"WIDTH={shlex.quote(str(r['coarse_width']))}")
          print(f"HEIGHT={shlex.quote(str(r['coarse_height']))}")
          PY
            )"

            build/candidate_mask_70               --elevation "$ROOT/elevation.f32"               --sea-mask "$ROOT/sea.u8"               --output "$ROOT/candidate.bit"               --report "$ROOT/candidate.json"               --width "$WIDTH"               --height "$HEIGHT"               --max-level 70

            build/candidate_land_components               --candidate-mask "$ROOT/candidate.bit"               --sea-mask "$ROOT/sea.u8"               --report "$ROOT/components.json"               --width "$WIDTH"               --height "$HEIGHT"
          done

      - name: Summarize hierarchy
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("tmp/hierarchical-components")

          rows = {}
          for factor in (16, 8, 4, 2, 1):
              base = root / f"factor-{factor}"
              c = json.loads(
                  (base / "components.json").read_text()
              )
              candidate = json.loads(
                  (base / "candidate.json").read_text()
              )

              sizes = [
                  int(component["cells"])
                  for component in c["components"]
              ]
              total = int(c["land_candidate_cells"])

              rows[str(factor)] = {
                  "factor": factor,
                  "component_count": int(
                      c["component_count"]
                  ),
                  "land_candidate_cells": total,
                  "candidate_land_pct": float(
                      candidate["candidate_land_pct"]
                  ),
                  "largest_component_cells": int(
                      c["largest_component_cells"]
                  ),
                  "largest_component_pct": float(
                      c[
                          "largest_component_pct_of_land_candidates"
                      ]
                  ),
                  "components_ge_1000_cells": sum(
                      size >= 1000
                      for size in sizes
                  ),
                  "components_ge_10000_cells": sum(
                      size >= 10000
                      for size in sizes
                  ),
                  "components_ge_100000_cells": sum(
                      size >= 100000
                      for size in sizes
                  ),
                  "top_10": c["components"][:10],
              }

          summary = {
              "levels": rows,
          }
          (root / "hierarchy-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )

          print(
              "factor components largest_pct "
              "candidate_land_pct largest_cells"
          )
          for factor in (16, 8, 4, 2, 1):
              row = rows[str(factor)]
              print(
                  factor,
                  row["component_count"],
                  row["largest_component_pct"],
                  row["candidate_land_pct"],
                  row["largest_component_cells"],
              )
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hierarchical-candidate-components-alps
          path: |
            tmp/hierarchical-components/hierarchy-summary.json
            tmp/hierarchical-components/factor-*/candidate.json
            tmp/hierarchical-components/factor-*/components.json
            tmp/hierarchical-components/factor-1/candidate.log
            tmp/hierarchical-components/factor-1/components.log
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-hierarchical-components.yml ]; then
            git rm .github/workflows/tmp-hierarchical-components.yml
            git commit -m "Remove temporary hierarchical component workflow"
            git pull --rebase
            git push
          fi
