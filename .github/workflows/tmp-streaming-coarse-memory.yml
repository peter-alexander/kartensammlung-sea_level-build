name: Temporary streaming coarse memory benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-streaming-coarse-memory.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio

          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Prepare fine DEM
        run: |
          mkdir -p tmp/streaming-coarse cache

          python scripts/prepare_phase1a_dem.py             --config config/candidate_benchmark_north_adriatic_alps_z11.json             --cache-dir cache             --work-dir tmp/streaming-coarse             --workers 12

      - name: Prepare ocean mask
        run: |
          mkdir -p tmp/ocean-source

          curl -fL --retry 3 --retry-delay 5             -o cache/water-polygons-split-3857.zip             https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip             '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg'             -d tmp/ocean-source

          eval "$(
            python - tmp/streaming-coarse/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(g[key]))}")
          PY
          )"

          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"

          ogr2ogr             -f GPKG             tmp/streaming-coarse/ocean_clip.gpkg             "$SHP"             -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"             -spat_srs EPSG:3857

          gdal_rasterize             -burn 1             -init 0             -ot Byte             -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"             -ts "$GRID_WIDTH" "$GRID_HEIGHT"             -co COMPRESS=DEFLATE             -co TILED=YES             tmp/streaming-coarse/ocean_clip.gpkg             tmp/streaming-coarse/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py             --grid tmp/streaming-coarse/grid.json             --input tmp/streaming-coarse/ocean_mask.tif             --output tmp/streaming-coarse/sea_mask.u8

      - name: Measure factor 16 streaming build
        run: |
          eval "$(
            python - tmp/streaming-coarse/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          print(f"GRID_WIDTH={shlex.quote(str(g['width']))}")
          print(f"GRID_HEIGHT={shlex.quote(str(g['height']))}")
          PY
          )"

          /usr/bin/time -v             python scripts/build_conservative_candidate_coarse.py             --elevation tmp/streaming-coarse/elevation.f32             --sea-mask tmp/streaming-coarse/sea_mask.u8             --output-elevation tmp/streaming-coarse/coarse.f32             --output-sea-mask tmp/streaming-coarse/coarse-sea.u8             --report tmp/streaming-coarse/coarse-report.json             --width "$GRID_WIDTH"             --height "$GRID_HEIGHT"             --factor 16             2>&1 | tee tmp/streaming-coarse/coarse-build.log

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: streaming-coarse-memory
          path: |
            tmp/streaming-coarse/coarse-report.json
            tmp/streaming-coarse/coarse-build.log
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-streaming-coarse-memory.yml ]; then
            git rm .github/workflows/tmp-streaming-coarse-memory.yml
            git commit -m "Remove temporary streaming coarse workflow"
            git pull --rebase
            git push
          fi
