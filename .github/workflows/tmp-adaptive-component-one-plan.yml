name: Temporary adaptive component one plan

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-adaptive-component-one-plan.yml

permissions:
  actions: read
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow shapely mapbox-vector-tile

      - name: Download safe coarse work regions
        uses: actions/download-artifact@v4
        with:
          name: safe-coarse-work-regions-factor16
          path: tmp/adaptive-plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33542989761

      - name: Plan adaptive component one
        run: |
          set -euo pipefail
          mkdir -p cache

          /usr/bin/time -v \
            python scripts/plan_adaptive_work_region_domains.py \
              --components-report tmp/adaptive-plan/factor-16/components.json \
              --spans tmp/adaptive-plan/factor-16/components.rle \
              --parent-grid tmp/adaptive-plan/parent/grid.json \
              --component-id 1 \
              --factor 16 \
              --cache-dir cache \
              --coverage-zoom 8 \
              --coverage-context-tiles 1 \
              --workers 12 \
              --domain-pixels 512 \
              --output tmp/adaptive-plan/adaptive-component-1.json \
            2>&1 | tee tmp/adaptive-plan/adaptive-plan.log

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-component-one-plan
          path: |
            tmp/adaptive-plan/adaptive-component-1.json
            tmp/adaptive-plan/adaptive-plan.log
          retention-days: 14
          if-no-files-found: error

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-adaptive-component-one-plan.yml ]; then
            git rm .github/workflows/tmp-adaptive-component-one-plan.yml
            git commit -m "Remove temporary adaptive component one plan"
            git pull --rebase
            git push
          fi
