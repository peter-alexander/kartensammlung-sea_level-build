name: Temporary safe work region fidelity scan

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-work-region-fidelity-scan.yml

permissions:
  actions: read
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow shapely mapbox-vector-tile

      - name: Download safe coarse work regions
        uses: actions/download-artifact@v4
        with:
          name: safe-coarse-work-regions-factor16
          path: tmp/fidelity-scan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33542989761

      - name: Scan actual coverage
        run: |
          set -euo pipefail
          mkdir -p cache

          python scripts/scan_work_region_source_fidelity.py \
            --components-report tmp/fidelity-scan/factor-16/components.json \
            --spans tmp/fidelity-scan/factor-16/components.rle \
            --parent-grid tmp/fidelity-scan/parent/grid.json \
            --factor 16 \
            --cache-dir cache \
            --coverage-zoom 8 \
            --coverage-context-tiles 1 \
            --workers 12 \
            --domain-width 512 \
            --domain-height 512 \
            --output tmp/fidelity-scan/source-fidelity-scan.json

      - name: Upload scan
        uses: actions/upload-artifact@v4
        with:
          name: safe-work-region-source-fidelity-scan
          path: tmp/fidelity-scan/source-fidelity-scan.json
          retention-days: 14
          if-no-files-found: error

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-work-region-fidelity-scan.yml ]; then
            git rm .github/workflows/tmp-work-region-fidelity-scan.yml
            git commit -m "Remove temporary work region fidelity scan"
            git pull --rebase
            git push
          fi
