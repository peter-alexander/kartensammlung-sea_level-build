name: Temporary conservative coarse candidate benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-coarse-candidate-alps.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio

          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build candidate tool
        run: |
          mkdir -p build tmp/coarse-candidate-alps

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic             src/candidate_mask_70.cpp             -o build/candidate_mask_70

      - name: Prepare fine Z11 DEM
        run: |
          /usr/bin/time -v             python scripts/prepare_phase1a_dem.py             --config config/candidate_benchmark_north_adriatic_alps_z11.json             --cache-dir cache             --work-dir tmp/coarse-candidate-alps             --workers 12             2>&1 | tee tmp/coarse-candidate-alps/dem.log

      - name: Prepare fine ocean mask
        run: |
          mkdir -p cache tmp/ocean-source

          curl -fL --retry 3 --retry-delay 5             -o cache/water-polygons-split-3857.zip             https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip             '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg'             -d tmp/ocean-source

          eval "$(
            python - tmp/coarse-candidate-alps/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(g[key]))}")
          PY
          )"

          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          test -n "$SHP"

          ogr2ogr             -f GPKG             tmp/coarse-candidate-alps/ocean_clip.gpkg             "$SHP"             -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"             -spat_srs EPSG:3857

          gdal_rasterize             -burn 1             -init 0             -ot Byte             -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"             -ts "$GRID_WIDTH" "$GRID_HEIGHT"             -co COMPRESS=DEFLATE             -co TILED=YES             tmp/coarse-candidate-alps/ocean_clip.gpkg             tmp/coarse-candidate-alps/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py             --grid tmp/coarse-candidate-alps/grid.json             --input tmp/coarse-candidate-alps/ocean_mask.tif             --output tmp/coarse-candidate-alps/sea_mask.u8

      - name: Build exact fine candidate mask
        run: |
          eval "$(
            python - tmp/coarse-candidate-alps/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          print(f"GRID_WIDTH={shlex.quote(str(g['width']))}")
          print(f"GRID_HEIGHT={shlex.quote(str(g['height']))}")
          PY
          )"

          /usr/bin/time -v             build/candidate_mask_70             --elevation tmp/coarse-candidate-alps/elevation.f32             --sea-mask tmp/coarse-candidate-alps/sea_mask.u8             --output tmp/coarse-candidate-alps/fine-candidate.bit             --report tmp/coarse-candidate-alps/fine-candidate.json             --width "$GRID_WIDTH"             --height "$GRID_HEIGHT"             --max-level 70             2>&1 | tee tmp/coarse-candidate-alps/fine-candidate.log

      - name: Benchmark conservative coarse factors
        run: |
          set -euo pipefail

          eval "$(
            python - tmp/coarse-candidate-alps/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          print(f"GRID_WIDTH={shlex.quote(str(g['width']))}")
          print(f"GRID_HEIGHT={shlex.quote(str(g['height']))}")
          PY
          )"

          for FACTOR in 2 4 8 16; do
            ROOT="tmp/coarse-candidate-alps/factor-$FACTOR"
            mkdir -p "$ROOT"

            /usr/bin/time -v               python scripts/build_conservative_candidate_coarse.py               --elevation tmp/coarse-candidate-alps/elevation.f32               --sea-mask tmp/coarse-candidate-alps/sea_mask.u8               --output-elevation "$ROOT/elevation.f32"               --output-sea-mask "$ROOT/sea.u8"               --report "$ROOT/coarse-input.json"               --width "$GRID_WIDTH"               --height "$GRID_HEIGHT"               --factor "$FACTOR"               2>&1 | tee "$ROOT/coarse-build.log"

            eval "$(
              python - "$ROOT/coarse-input.json" <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          r = json.loads(Path(sys.argv[1]).read_text())
          print(f"COARSE_WIDTH={shlex.quote(str(r['coarse_width']))}")
          print(f"COARSE_HEIGHT={shlex.quote(str(r['coarse_height']))}")
          PY
            )"

            /usr/bin/time -v               build/candidate_mask_70               --elevation "$ROOT/elevation.f32"               --sea-mask "$ROOT/sea.u8"               --output "$ROOT/candidate.bit"               --report "$ROOT/candidate.json"               --width "$COARSE_WIDTH"               --height "$COARSE_HEIGHT"               --max-level 70               2>&1 | tee "$ROOT/candidate.log"

            /usr/bin/time -v               python scripts/compare_candidate_masks.py               --fine-mask tmp/coarse-candidate-alps/fine-candidate.bit               --coarse-mask "$ROOT/candidate.bit"               --sea-mask tmp/coarse-candidate-alps/sea_mask.u8               --output "$ROOT/comparison.json"               --width "$GRID_WIDTH"               --height "$GRID_HEIGHT"               --factor "$FACTOR"               2>&1 | tee "$ROOT/compare.log"
          done

      - name: Summarize
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("tmp/coarse-candidate-alps")
          fine = json.loads(
              (root / "fine-candidate.json").read_text()
          )

          def time_stats(path):
              text = Path(path).read_text()
              peak = re.search(
                  r"Maximum resident set size \(kbytes\):\s*(\d+)",
                  text,
              )
              elapsed = re.search(
                  r"Elapsed \(wall clock\) time \(h:mm:ss or m:ss\):\s*([^\n]+)",
                  text,
              )
              return {
                  "peak_rss_kb": int(peak.group(1)) if peak else None,
                  "elapsed": elapsed.group(1).strip() if elapsed else None,
              }

          factors = {}
          for factor in (2, 4, 8, 16):
              base = root / f"factor-{factor}"
              factors[str(factor)] = {
                  "coarse_input": json.loads(
                      (base / "coarse-input.json").read_text()
                  ),
                  "coarse_candidate": json.loads(
                      (base / "candidate.json").read_text()
                  ),
                  "comparison": json.loads(
                      (base / "comparison.json").read_text()
                  ),
                  "timing": {
                      "coarse_build": time_stats(
                          base / "coarse-build.log"
                      ),
                      "coarse_candidate": time_stats(
                          base / "candidate.log"
                      ),
                      "comparison": time_stats(
                          base / "compare.log"
                      ),
                  },
              }

          summary = {
              "fine": fine,
              "factors": factors,
          }

          (root / "summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )

          print("factor false_neg land_kept land_excluded inflation")
          for factor in (2, 4, 8, 16):
              c = factors[str(factor)]["comparison"]
              print(
                  factor,
                  c["false_negative_cells"],
                  c["conservative_candidate_land_pct"],
                  c["conservative_land_excluded_pct"],
                  c["land_candidate_inflation_factor"],
              )
          PY

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: conservative-coarse-candidate-alps
          path: |
            tmp/coarse-candidate-alps/grid.json
            tmp/coarse-candidate-alps/fine-candidate.json
            tmp/coarse-candidate-alps/summary.json
            tmp/coarse-candidate-alps/fine-candidate.log
            tmp/coarse-candidate-alps/factor-*/coarse-input.json
            tmp/coarse-candidate-alps/factor-*/candidate.json
            tmp/coarse-candidate-alps/factor-*/comparison.json
            tmp/coarse-candidate-alps/factor-*/coarse-build.log
            tmp/coarse-candidate-alps/factor-*/candidate.log
            tmp/coarse-candidate-alps/factor-*/compare.log
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-coarse-candidate-alps.yml ]; then
            git rm .github/workflows/tmp-coarse-candidate-alps.yml
            git commit -m "Remove temporary coarse candidate benchmark workflow"
            git pull --rebase
            git push
          fi
