name: Temporary exact land component benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-exact-land-components-alps.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio

          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build tools
        run: |
          mkdir -p build tmp/exact-land-components cache

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic             src/candidate_mask_70.cpp             -o build/candidate_mask_70

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic             src/candidate_land_components.cpp             -o build/candidate_land_components

      - name: Prepare streamed DEM
        run: |
          python scripts/prepare_phase1a_dem.py             --config config/candidate_benchmark_north_adriatic_alps_z11.json             --cache-dir cache             --work-dir tmp/exact-land-components             --workers 12

      - name: Prepare ocean mask
        run: |
          mkdir -p tmp/ocean-source

          curl -fL --retry 3 --retry-delay 5             -o cache/water-polygons-split-3857.zip             https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip             '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg'             -d tmp/ocean-source

          eval "$(
            python - tmp/exact-land-components/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(g[key]))}")
          PY
          )"

          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"

          ogr2ogr             -f GPKG             tmp/exact-land-components/ocean_clip.gpkg             "$SHP"             -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"             -spat_srs EPSG:3857

          gdal_rasterize             -burn 1             -init 0             -ot Byte             -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP"             -ts "$GRID_WIDTH" "$GRID_HEIGHT"             -co COMPRESS=DEFLATE             -co TILED=YES             tmp/exact-land-components/ocean_clip.gpkg             tmp/exact-land-components/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py             --grid tmp/exact-land-components/grid.json             --input tmp/exact-land-components/ocean_mask.tif             --output tmp/exact-land-components/sea_mask.u8

      - name: Build exact Z11 candidate mask
        run: |
          eval "$(
            python - tmp/exact-land-components/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          print(f"GRID_WIDTH={shlex.quote(str(g['width']))}")
          print(f"GRID_HEIGHT={shlex.quote(str(g['height']))}")
          PY
          )"

          /usr/bin/time -v             build/candidate_mask_70             --elevation tmp/exact-land-components/elevation.f32             --sea-mask tmp/exact-land-components/sea_mask.u8             --output tmp/exact-land-components/candidate.bit             --report tmp/exact-land-components/candidate.json             --width "$GRID_WIDTH"             --height "$GRID_HEIGHT"             --max-level 70             2>&1 | tee tmp/exact-land-components/candidate.log

      - name: Analyze exact land components
        run: |
          eval "$(
            python - tmp/exact-land-components/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          print(f"GRID_WIDTH={shlex.quote(str(g['width']))}")
          print(f"GRID_HEIGHT={shlex.quote(str(g['height']))}")
          PY
          )"

          /usr/bin/time -v             build/candidate_land_components             --candidate-mask tmp/exact-land-components/candidate.bit             --sea-mask tmp/exact-land-components/sea_mask.u8             --report tmp/exact-land-components/components.json             --width "$GRID_WIDTH"             --height "$GRID_HEIGHT"             2>&1 | tee tmp/exact-land-components/components.log

      - name: Summarize
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("tmp/exact-land-components")
          report = json.loads(
              (root / "components.json").read_text()
          )
          candidate = json.loads(
              (root / "candidate.json").read_text()
          )
          cells = [
              int(component["cells"])
              for component in report["components"]
          ]
          total = int(report["land_candidate_cells"])

          thresholds = [
              1,
              10,
              100,
              1000,
              10000,
              100000,
              1000000,
              10000000,
          ]

          def stats(path):
              text = Path(path).read_text()
              peak = re.search(
                  r"Maximum resident set size \(kbytes\):\s*(\d+)",
                  text,
              )
              elapsed = re.search(
                  r"Elapsed \(wall clock\) time \(h:mm:ss or m:ss\):\s*([^\n]+)",
                  text,
              )
              return {
                  "peak_rss_kb": int(peak.group(1)) if peak else None,
                  "elapsed": elapsed.group(1).strip() if elapsed else None,
              }

          summary = {
              "candidate": candidate,
              "component_count": report["component_count"],
              "land_candidate_cells": total,
              "largest_component_cells": report[
                  "largest_component_cells"
              ],
              "largest_component_pct_of_land_candidates": report[
                  "largest_component_pct_of_land_candidates"
              ],
              "components_ge_cells": {
                  str(limit): sum(
                      cell_count >= limit
                      for cell_count in cells
                  )
                  for limit in thresholds
              },
              "top_20": report["components"][:20],
              "timing": {
                  "candidate": stats(
                      root / "candidate.log"
                  ),
                  "components": stats(
                      root / "components.log"
                  ),
              },
          }

          (root / "summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: exact-candidate-land-components-alps
          path: |
            tmp/exact-land-components/candidate.json
            tmp/exact-land-components/components.json
            tmp/exact-land-components/summary.json
            tmp/exact-land-components/candidate.log
            tmp/exact-land-components/components.log
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-exact-land-components-alps.yml ]; then
            git rm .github/workflows/tmp-exact-land-components-alps.yml
            git commit -m "Remove temporary exact land component workflow"
            git pull --rebase
            git push
          fi
