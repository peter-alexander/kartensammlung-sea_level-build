name: Temporary Z12 bridge to Z13 benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-z12-z13-bridge.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio shapely mapbox-vector-tile
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build Priority Flood
        run: |
          mkdir -p build tmp/bridge
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_quantized.cpp \
            -o build/priority_flood_quantized

      - name: Generate coverage plan
        run: |
          python scripts/coverage_planner.py \
            --bbox=2.5,51.2,5.5,53.2 \
            --output-dir tmp/bridge/coverage \
            --coverage-zoom 8 \
            --cache-dir cache \
            --workers 12

          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(
              Path("tmp/bridge/coverage/plan.json").read_text()
          )
          ahn = [
              item
              for item in plan["sources"]
              if item["source"] == "nlahn5lowresfilled"
          ]
          assert len(ahn) == 1, ahn
          assert ahn[0]["recommended_processing_zoom"] == 13
          print(json.dumps(ahn[0], indent=2))
          PY

      - name: Download ocean polygons
        run: |
          mkdir -p cache tmp/ocean-source
          curl -fL --retry 3 --retry-delay 5 \
            -o cache/water-polygons-split-3857.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip \
            '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg' \
            -d tmp/ocean-source

      - name: Build Z11 parent
        run: |
          set -euo pipefail
          mkdir -p tmp/bridge/z11

          python scripts/prepare_phase1a_dem.py \
            --config config/north_sea_pilot.json \
            --cache-dir cache \
            --work-dir tmp/bridge/z11 \
            --workers 12

          eval "$(
            python - tmp/bridge/z11/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(grid[key]))}")
          PY
          )"

          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          ogr2ogr \
            -f GPKG \
            tmp/bridge/z11/ocean_clip.gpkg \
            "$SHP" \
            -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -spat_srs EPSG:3857

          gdal_rasterize \
            -burn 1 \
            -init 0 \
            -ot Byte \
            -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
            tmp/bridge/z11/ocean_clip.gpkg \
            tmp/bridge/z11/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py \
            --grid tmp/bridge/z11/grid.json \
            --input tmp/bridge/z11/ocean_mask.tif \
            --output tmp/bridge/z11/sea_mask.u8

          build/priority_flood_quantized \
            --elevation tmp/bridge/z11/elevation.f32 \
            --sea-mask tmp/bridge/z11/sea_mask.u8 \
            --output tmp/bridge/z11/threshold.u8 \
            --width "$GRID_WIDTH" \
            --height "$GRID_HEIGHT" \
            --levels "$(python scripts/threshold_levels.py --csv)" \
            --connectivity 4

      - name: Build broad Z12 transition
        run: |
          set -euo pipefail
          ROOT="tmp/bridge/z12"
          WORK="$ROOT/work"
          mkdir -p "$ROOT" "$WORK"
          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"

          python scripts/prepare_refinement_region.py \
            --sources-geojson tmp/bridge/coverage/sources-context.geojson \
            --source nlahn5lowresfilled \
            --parent-grid tmp/bridge/z11/grid.json \
            --fine-zoom 12 \
            --halo-projected-m 9783.93962050256 \
            --transition-buffer-projected-m 9783.93962050256 \
            --output-config "$ROOT/config.json" \
            --output-core "$ROOT/core.geojson"

          python scripts/prepare_phase1a_dem.py \
            --config "$ROOT/config.json" \
            --cache-dir cache \
            --work-dir "$WORK" \
            --workers 12

          eval "$(
            python - "$WORK/grid.json" <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(grid[key]))}")
          PY
          )"

          ogr2ogr \
            -f GPKG \
            "$WORK/ocean_clip.gpkg" \
            "$SHP" \
            -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -spat_srs EPSG:3857

          gdal_rasterize \
            -burn 1 \
            -init 0 \
            -ot Byte \
            -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
            "$WORK/ocean_clip.gpkg" \
            "$WORK/ocean_mask.tif"

          python scripts/write_ocean_mask_raw.py \
            --grid "$WORK/grid.json" \
            --input "$WORK/ocean_mask.tif" \
            --output "$WORK/sea_mask.u8" \
            --allow-empty-sea

          python scripts/build_refinement_boundary.py \
            --coarse-grid tmp/bridge/z11/grid.json \
            --coarse-threshold tmp/bridge/z11/threshold.u8 \
            --fine-grid "$WORK/grid.json" \
            --output "$WORK/boundary.u8"

          build/priority_flood_quantized \
            --elevation "$WORK/elevation.f32" \
            --sea-mask "$WORK/sea_mask.u8" \
            --boundary-threshold "$WORK/boundary.u8" \
            --output "$WORK/threshold.u8" \
            --width "$GRID_WIDTH" \
            --height "$GRID_HEIGHT" \
            --levels "$(python scripts/threshold_levels.py --csv)" \
            --connectivity 4

          python scripts/build_composite_threshold.py \
            --base-grid tmp/bridge/z11/grid.json \
            --base-threshold tmp/bridge/z11/threshold.u8 \
            --fine-grid "$WORK/grid.json" \
            --fine-threshold "$WORK/threshold.u8" \
            --core-geojson "$ROOT/core.geojson" \
            --output-dir tmp/bridge/z12-composite \
            --chunk-rows 128

          cp "$ROOT/config.report.json" \
            tmp/bridge/z12-refinement-report.json
          cp tmp/bridge/z12-composite/report.json \
            tmp/bridge/z12-outer-seam-report.json

          rm -rf "$WORK"

      - name: Build Z13 core from Z12 parent
        run: |
          set -euo pipefail
          ROOT="tmp/bridge/z13"
          WORK="$ROOT/work"
          mkdir -p "$ROOT" "$WORK"
          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"

          python scripts/prepare_refinement_region.py \
            --sources-geojson tmp/bridge/coverage/sources-context.geojson \
            --source nlahn5lowresfilled \
            --parent-grid tmp/bridge/z12-composite/grid.json \
            --fine-zoom 13 \
            --halo-projected-m 9783.93962050256 \
            --transition-buffer-projected-m 2445.98490512564 \
            --output-config "$ROOT/config.json" \
            --output-core "$ROOT/core.geojson"

          python scripts/prepare_phase1a_dem.py \
            --config "$ROOT/config.json" \
            --cache-dir cache \
            --work-dir "$WORK" \
            --workers 12

          eval "$(
            python - "$WORK/grid.json" <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for key in ("left", "bottom", "right", "top", "width", "height"):
              print(f"GRID_{key.upper()}={shlex.quote(str(grid[key]))}")
          PY
          )"

          ogr2ogr \
            -f GPKG \
            "$WORK/ocean_clip.gpkg" \
            "$SHP" \
            -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -spat_srs EPSG:3857

          gdal_rasterize \
            -burn 1 \
            -init 0 \
            -ot Byte \
            -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
            "$WORK/ocean_clip.gpkg" \
            "$WORK/ocean_mask.tif"

          python scripts/write_ocean_mask_raw.py \
            --grid "$WORK/grid.json" \
            --input "$WORK/ocean_mask.tif" \
            --output "$WORK/sea_mask.u8" \
            --allow-empty-sea

          python scripts/build_refinement_boundary.py \
            --coarse-grid tmp/bridge/z12-composite/grid.json \
            --coarse-threshold tmp/bridge/z12-composite/threshold.u8 \
            --fine-grid "$WORK/grid.json" \
            --output "$WORK/boundary.u8"

          /usr/bin/time -v \
            build/priority_flood_quantized \
            --elevation "$WORK/elevation.f32" \
            --sea-mask "$WORK/sea_mask.u8" \
            --boundary-threshold "$WORK/boundary.u8" \
            --output "$WORK/threshold.u8" \
            --width "$GRID_WIDTH" \
            --height "$GRID_HEIGHT" \
            --levels "$(python scripts/threshold_levels.py --csv)" \
            --connectivity 4 \
            2>&1 | tee tmp/bridge/z13-flood.log

          python scripts/compare_refinement_seam.py \
            --base-grid tmp/bridge/z12-composite/grid.json \
            --base-threshold tmp/bridge/z12-composite/threshold.u8 \
            --fine-grid "$WORK/grid.json" \
            --fine-threshold "$WORK/threshold.u8" \
            --core-geojson "$ROOT/core.geojson" \
            --output tmp/bridge/z13-inner-seam-report.json

          cp "$ROOT/config.report.json" \
            tmp/bridge/z13-refinement-report.json
          cp "$WORK/boundary.report.json" \
            tmp/bridge/z13-boundary-report.json

      - name: Compare bridge result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          outer = json.loads(
              Path("tmp/bridge/z12-outer-seam-report.json").read_text()
          )
          inner = json.loads(
              Path("tmp/bridge/z13-inner-seam-report.json").read_text()
          )

          outer_slider = outer[
              "refinement_seam_slider_disagreement_vs_upsampled_base"
          ]
          inner_slider = inner[
              "refinement_seam_slider_disagreement_vs_upsampled_base"
          ]

          result = {
              "benchmark": "z11-z12-z13-bridge",
              "direct_z13_to_z11_baseline": {
                  "maximum": {
                      "different_pct": 6.388878,
                      "at_level_m": 5.0,
                  },
                  "bands": {
                      "0-2m": 0.007176,
                      "2-5m": 6.388878,
                      "5-20m": 0.144831,
                      "20-70m": 0.099164,
                  },
              },
              "z12_outer_seam_to_z11": {
                  "maximum": outer_slider["maximum"],
                  "bands": outer_slider["bands"],
              },
              "z13_inner_seam_to_z12": {
                  "maximum": inner_slider["maximum"],
                  "bands": inner_slider["bands"],
              },
          }
          Path("tmp/bridge/summary.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Upload bridge benchmark
        uses: actions/upload-artifact@v4
        with:
          name: z12-z13-bridge-benchmark
          path: |
            tmp/bridge/summary.json
            tmp/bridge/z12-refinement-report.json
            tmp/bridge/z12-outer-seam-report.json
            tmp/bridge/z13-refinement-report.json
            tmp/bridge/z13-boundary-report.json
            tmp/bridge/z13-inner-seam-report.json
            tmp/bridge/z13-flood.log
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-z12-z13-bridge.yml
          git commit -m "Remove temporary Z12-Z13 bridge benchmark"
          git pull --rebase
          git push
