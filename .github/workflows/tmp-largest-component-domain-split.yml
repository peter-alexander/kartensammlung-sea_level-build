name: Temporary largest component domain split

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-largest-component-domain-split.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio

          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build tools
        run: |
          mkdir -p build tmp/domain-split cache

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/candidate_mask_70.cpp \
            -o build/candidate_mask_70

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/candidate_land_components.cpp \
            -o build/candidate_land_components

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_land_mask.cpp \
            -o build/priority_flood_land_mask

          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_quantized.cpp \
            -o build/priority_flood_quantized

      - name: Prepare streamed Z11 DEM
        run: |
          /usr/bin/time -v \
            python scripts/prepare_phase1a_dem.py \
              --config config/candidate_benchmark_north_adriatic_alps_z11.json \
              --cache-dir cache \
              --work-dir tmp/domain-split/global \
              --workers 12 \
            2>&1 | tee tmp/domain-split/dem.log

      - name: Prepare ocean mask
        run: |
          mkdir -p tmp/ocean-source

          curl -fL --retry 3 --retry-delay 5 \
            -o cache/water-polygons-split-3857.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

          unzip -j cache/water-polygons-split-3857.zip \
            '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg' \
            -d tmp/ocean-source

          eval "$(
            python - tmp/domain-split/global/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(
              Path(sys.argv[1]).read_text()
          )["grid"]
          for key in (
              "left",
              "bottom",
              "right",
              "top",
              "width",
              "height",
          ):
              print(
                  f"GRID_{key.upper()}="
                  f"{shlex.quote(str(grid[key]))}"
              )
          PY
          )"

          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          test -n "$SHP"

          ogr2ogr \
            -f GPKG \
            tmp/domain-split/global/ocean_clip.gpkg \
            "$SHP" \
            -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -spat_srs EPSG:3857

          gdal_rasterize \
            -burn 1 \
            -init 0 \
            -ot Byte \
            -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
            -co COMPRESS=DEFLATE \
            -co TILED=YES \
            tmp/domain-split/global/ocean_clip.gpkg \
            tmp/domain-split/global/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py \
            --grid tmp/domain-split/global/grid.json \
            --input tmp/domain-split/global/ocean_mask.tif \
            --output tmp/domain-split/global/sea_mask.u8

      - name: Build exact candidate and components
        run: |
          eval "$(
            python - tmp/domain-split/global/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(
              Path(sys.argv[1]).read_text()
          )["grid"]
          print(
              "WIDTH="
              + shlex.quote(str(grid["width"]))
          )
          print(
              "HEIGHT="
              + shlex.quote(str(grid["height"]))
          )
          PY
          )"

          /usr/bin/time -v \
            build/candidate_mask_70 \
              --elevation tmp/domain-split/global/elevation.f32 \
              --sea-mask tmp/domain-split/global/sea_mask.u8 \
              --output tmp/domain-split/global/candidate.bit \
              --report tmp/domain-split/global/candidate.json \
              --width "$WIDTH" \
              --height "$HEIGHT" \
              --max-level 70 \
            2>&1 | tee tmp/domain-split/candidate.log

          /usr/bin/time -v \
            build/candidate_land_components \
              --candidate-mask tmp/domain-split/global/candidate.bit \
              --sea-mask tmp/domain-split/global/sea_mask.u8 \
              --report tmp/domain-split/global/components.json \
              --spans-output tmp/domain-split/global/components.rle \
              --width "$WIDTH" \
              --height "$HEIGHT" \
            2>&1 | tee tmp/domain-split/components.log

      - name: Materialize largest component
        run: |
          eval "$(
            python - \
              tmp/domain-split/global/grid.json \
              tmp/domain-split/global/components.json \
              <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          grid = json.loads(
              Path(sys.argv[1]).read_text()
          )["grid"]
          report = json.loads(
              Path(sys.argv[2]).read_text()
          )
          largest = report["components"][0]

          print(
              "GLOBAL_WIDTH="
              + shlex.quote(str(grid["width"]))
          )
          print(
              "GLOBAL_HEIGHT="
              + shlex.quote(str(grid["height"]))
          )
          print(
              "COMPONENT_ID="
              + shlex.quote(str(largest["id"]))
          )
          PY
          )"

          python scripts/materialize_candidate_component.py \
            --components-report tmp/domain-split/global/components.json \
            --spans tmp/domain-split/global/components.rle \
            --component-id "$COMPONENT_ID" \
            --elevation tmp/domain-split/global/elevation.f32 \
            --sea-mask tmp/domain-split/global/sea_mask.u8 \
            --output-dir tmp/domain-split/largest \
            --global-width "$GLOBAL_WIDTH" \
            --global-height "$GLOBAL_HEIGHT" \
            --halo 1

          cat tmp/domain-split/largest/component.json

      - name: Solve largest component directly
        run: |
          eval "$(
            python - tmp/domain-split/largest/component.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          meta = json.loads(Path(sys.argv[1]).read_text())
          window = meta["window"]
          print(
              "WIDTH="
              + shlex.quote(str(window["width"]))
          )
          print(
              "HEIGHT="
              + shlex.quote(str(window["height"]))
          )
          PY
          )"

          /usr/bin/time -v \
            build/priority_flood_land_mask \
              --elevation tmp/domain-split/largest/elevation.f32 \
              --sea-mask tmp/domain-split/largest/sea_mask.u8 \
              --land-mask tmp/domain-split/largest/land_mask.bit \
              --output tmp/domain-split/largest/direct.u8 \
              --width "$WIDTH" \
              --height "$HEIGHT" \
              --levels "$(python scripts/threshold_levels.py --csv)" \
            2>&1 | tee tmp/domain-split/direct.log

      - name: Solve largest component as domains
        run: |
          eval "$(
            python - tmp/domain-split/largest/component.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path

          meta = json.loads(Path(sys.argv[1]).read_text())
          window = meta["window"]
          print(
              "WIDTH="
              + shlex.quote(str(window["width"]))
          )
          print(
              "HEIGHT="
              + shlex.quote(str(window["height"]))
          )
          PY
          )"

          /usr/bin/time -v \
            python scripts/process_component_domains.py \
              --elevation tmp/domain-split/largest/elevation.f32 \
              --sea-mask tmp/domain-split/largest/sea_mask.u8 \
              --land-mask tmp/domain-split/largest/land_mask.bit \
              --output tmp/domain-split/largest/split.u8 \
              --work-dir tmp/domain-split/largest/domains \
              --solver build/priority_flood_quantized \
              --levels "$(python scripts/threshold_levels.py --csv)" \
              --width "$WIDTH" \
              --height "$HEIGHT" \
              --domain-width 2048 \
              --domain-height 2048 \
              --report tmp/domain-split/largest/domain-report.json \
            2>&1 | tee tmp/domain-split/split.log

      - name: Compare and summarize
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          import numpy as np

          root = Path("tmp/domain-split")
          meta = json.loads(
              (root / "largest/component.json").read_text()
          )
          window = meta["window"]
          shape = (
              int(window["height"]),
              int(window["width"]),
          )

          direct = np.memmap(
              root / "largest/direct.u8",
              dtype=np.uint8,
              mode="r",
              shape=shape,
          )
          split = np.memmap(
              root / "largest/split.u8",
              dtype=np.uint8,
              mode="r",
              shape=shape,
          )

          differing = int(
              np.count_nonzero(direct != split)
          )
          max_abs_class_difference = int(
              np.max(
                  np.abs(
                      direct.astype(np.int16)
                      - split.astype(np.int16)
                  )
              )
          )

          if differing:
              raise AssertionError(
                  f"Domain-Ergebnis hat {differing} "
                  "abweichende Zellen."
              )

          def time_stats(path):
              text = Path(path).read_text()
              peak = re.search(
                  r"Maximum resident set size \(kbytes\):\s*(\d+)",
                  text,
              )
              elapsed = re.search(
                  r"Elapsed \(wall clock\) time "
                  r"\(h:mm:ss or m:ss\):\s*([^\n]+)",
                  text,
              )
              return {
                  "peak_rss_kb": (
                      int(peak.group(1))
                      if peak
                      else None
                  ),
                  "elapsed": (
                      elapsed.group(1).strip()
                      if elapsed
                      else None
                  ),
              }

          summary = {
              "component": meta,
              "domain": json.loads(
                  (
                      root
                      / "largest/domain-report.json"
                  ).read_text()
              ),
              "comparison": {
                  "differing_cells": differing,
                  "max_abs_class_difference": (
                      max_abs_class_difference
                  ),
                  "byte_identical": differing == 0,
              },
              "timing": {
                  "direct": time_stats(
                      root / "direct.log"
                  ),
                  "split": time_stats(
                      root / "split.log"
                  ),
              },
          }

          (
              root / "summary.json"
          ).write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: largest-component-domain-split
          path: |
            tmp/domain-split/summary.json
            tmp/domain-split/global/candidate.json
            tmp/domain-split/global/components.json
            tmp/domain-split/largest/component.json
            tmp/domain-split/largest/domain-report.json
            tmp/domain-split/direct.log
            tmp/domain-split/split.log
          retention-days: 14
          if-no-files-found: error

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          if [ -f .github/workflows/tmp-largest-component-domain-split.yml ]; then
            git rm .github/workflows/tmp-largest-component-domain-split.yml
            git commit -m "Remove temporary largest component domain workflow"
            git pull --rebase
            git push
          fi
