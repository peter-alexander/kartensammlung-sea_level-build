name: Temporary planet fallback extract test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-planet-fallback-test.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PMTiles CLI
        run: |
          go install github.com/protomaps/go-pmtiles@latest

      - name: Extract planet fallback
        run: |
          /usr/bin/time -v \
            "$(go env GOPATH)/bin/go-pmtiles" extract \
            --bbox=2.5,51.2,5.5,53.2 \
            --minzoom=11 \
            --maxzoom=12 \
            --overfetch=0 \
            https://download.mapterhorn.com/planet.pmtiles \
            fallback.pmtiles \
            2>&1 | tee extract.log

          "$(go env GOPATH)/bin/go-pmtiles" verify fallback.pmtiles

          /usr/bin/time -v \
            "$(go env GOPATH)/bin/go-pmtiles" convert \
            fallback.pmtiles \
            fallback.mbtiles \
            2>&1 | tee convert.log

          ls -lh fallback.pmtiles fallback.mbtiles

          python - <<'PY'
          import sqlite3

          db = sqlite3.connect("fallback.mbtiles")
          rows = db.execute(
              "SELECT zoom_level, COUNT(*) FROM tiles "
              "GROUP BY zoom_level ORDER BY zoom_level"
          ).fetchall()
          print(rows)
          assert any(z == 11 and count > 0 for z, count in rows)
          assert any(z == 12 and count > 0 for z, count in rows)
          PY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: planet-fallback-extract-test
          path: |
            extract.log
            convert.log
          retention-days: 7

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-planet-fallback-test.yml
          git commit -m "Remove temporary planet fallback test"
          git pull --rebase
          git push
