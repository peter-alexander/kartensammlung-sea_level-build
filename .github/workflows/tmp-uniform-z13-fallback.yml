name: Temporary uniform Z13 fallback pilot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-uniform-z13-fallback.yml

permissions:
  contents: write

jobs:
  uniform-z13:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip

      - name: Build Priority Flood
        run: |
          mkdir -p build tmp/uniform-z13
          g++ -O3 -std=c++20 -Wall -Wextra -pedantic \
            src/priority_flood_quantized.cpp \
            -o build/priority_flood_quantized

      - name: Prepare config and preflight
        run: |
          python - <<'PY'
          import json
          import math
          import shutil
          from pathlib import Path

          config = json.loads(
              Path("config/north_sea_pilot.json").read_text()
          )
          config["name"] = "north-sea-v2-uniform-z13-western-netherlands"
          config["dem"] = {
              "provider": "mapterhorn",
              "tile_endpoint": "https://tiles.mapterhorn.com/{z}/{x}/{y}.webp",
              "processing_zoom": 13,
              "tile_size": 512,
              "encoding": "terrarium",
              "overzoom_fallback_minzoom": 12,
          }
          Path("tmp/uniform-z13/config.json").write_text(
              json.dumps(config, indent=2) + "\n"
          )

          z = 13
          ts = 512
          b = config["bounds"]
          def tx(lon):
              return (lon + 180.0) / 360.0 * (2 ** z)
          def ty(lat):
              r = math.radians(lat)
              return (
                  1.0 - math.asinh(math.tan(r)) / math.pi
              ) / 2.0 * (2 ** z)

          x0 = math.floor(tx(b["west"]))
          x1 = math.ceil(tx(b["east"])) - 1
          y0 = math.floor(ty(b["north"]))
          y1 = math.ceil(ty(b["south"])) - 1
          width = (x1 - x0 + 1) * ts
          height = (y1 - y0 + 1) * ts
          cells = width * height

          flood_bytes_per_cell = (282364 * 1024) / 50331648
          flood_est = cells * flood_bytes_per_cell

          mem_total = 0
          for line in Path("/proc/meminfo").read_text().splitlines():
              if line.startswith("MemTotal:"):
                  mem_total = int(line.split()[1]) * 1024
                  break

          free_disk = shutil.disk_usage(".").free
          gib = 1024 ** 3
          report = {
              "zoom": z,
              "width": width,
              "height": height,
              "cells": cells,
              "estimated_flood_ram_gib": round(flood_est / gib, 3),
              "runner_ram_gib": round(mem_total / gib, 3),
              "runner_free_disk_gib": round(free_disk / gib, 3),
          }
          Path("tmp/uniform-z13/preflight.json").write_text(
              json.dumps(report, indent=2) + "\n"
          )
          print(json.dumps(report, indent=2))

          assert cells < 2 ** 32
          if mem_total and flood_est * 1.35 > mem_total:
              raise RuntimeError("Zu wenig Runner-RAM.")
          PY

      - name: Download ocean polygons
        run: |
          mkdir -p cache tmp/ocean-source
          curl -fL --retry 3 --retry-delay 5 \
            -o cache/water-polygons-split-3857.zip \
            https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          unzip -j cache/water-polygons-split-3857.zip \
            '*.shp' '*.shx' '*.dbf' '*.prj' '*.cpg' \
            -d tmp/ocean-source

      - name: Prepare uniform Z13 DEM
        run: |
          /usr/bin/time -v \
            python scripts/prepare_phase1a_dem.py \
            --config tmp/uniform-z13/config.json \
            --cache-dir cache \
            --work-dir tmp/uniform-z13/work \
            --workers 12 \
            2>&1 | tee tmp/uniform-z13/dem.log

          python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path("tmp/uniform-z13/work/grid.json").read_text()
          )["dem"]
          print(json.dumps({
              "requested_missing_tile_count": d[
                  "requested_missing_tile_count"
              ],
              "fallback_tile_count": d["fallback_tile_count"],
              "missing_tile_count": d["missing_tile_count"],
          }, indent=2))
          assert d["missing_tile_count"] == 0
          assert d["fallback_tile_count"] > 0
          PY

      - name: Rasterize ocean mask
        run: |
          set -euo pipefail
          SHP="$(find tmp/ocean-source -maxdepth 1 -name '*.shp' -print -quit)"
          eval "$(
            python - tmp/uniform-z13/work/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path
          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          for k in ("left","bottom","right","top","width","height"):
              print(f"GRID_{k.upper()}={shlex.quote(str(g[k]))}")
          PY
          )"

          ogr2ogr \
            -f GPKG \
            tmp/uniform-z13/work/ocean_clip.gpkg \
            "$SHP" \
            -spat "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -spat_srs EPSG:3857

          gdal_rasterize \
            -burn 1 \
            -init 0 \
            -ot Byte \
            -te "$GRID_LEFT" "$GRID_BOTTOM" "$GRID_RIGHT" "$GRID_TOP" \
            -ts "$GRID_WIDTH" "$GRID_HEIGHT" \
            -co COMPRESS=DEFLATE \
            -co TILED=YES \
            tmp/uniform-z13/work/ocean_clip.gpkg \
            tmp/uniform-z13/work/ocean_mask.tif

          python scripts/write_ocean_mask_raw.py \
            --grid tmp/uniform-z13/work/grid.json \
            --input tmp/uniform-z13/work/ocean_mask.tif \
            --output tmp/uniform-z13/work/sea_mask.u8

      - name: Run uniform Z13 Priority Flood
        run: |
          eval "$(
            python - tmp/uniform-z13/work/grid.json <<'PY'
          import json
          import shlex
          import sys
          from pathlib import Path
          g = json.loads(Path(sys.argv[1]).read_text())["grid"]
          print(f"WIDTH={shlex.quote(str(g['width']))}")
          print(f"HEIGHT={shlex.quote(str(g['height']))}")
          PY
          )"

          /usr/bin/time -v \
            build/priority_flood_quantized \
            --elevation tmp/uniform-z13/work/elevation.f32 \
            --sea-mask tmp/uniform-z13/work/sea_mask.u8 \
            --output tmp/uniform-z13/work/threshold.u8 \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --levels "$(python scripts/threshold_levels.py --csv)" \
            --connectivity 4 \
            2>&1 | tee tmp/uniform-z13/flood.log

      - name: Build raster pyramid
        run: |
          /usr/bin/time -v \
            python scripts/build_threshold_pyramid.py \
            --config tmp/uniform-z13/config.json \
            --grid tmp/uniform-z13/work/grid.json \
            --threshold tmp/uniform-z13/work/threshold.u8 \
            --output tmp/uniform-z13/uniform-z13.mbtiles \
            --report tmp/uniform-z13/pyramid-report.json \
            --minzoom 6 \
            2>&1 | tee tmp/uniform-z13/pyramid.log

      - name: Convert and verify PMTiles
        run: |
          go install github.com/protomaps/go-pmtiles@latest

          "$(go env GOPATH)/bin/go-pmtiles" convert \
            tmp/uniform-z13/uniform-z13.mbtiles \
            tmp/uniform-z13/sea-level-uniform-z13.pmtiles

          "$(go env GOPATH)/bin/go-pmtiles" verify \
            tmp/uniform-z13/sea-level-uniform-z13.pmtiles

          "$(go env GOPATH)/bin/go-pmtiles" show \
            tmp/uniform-z13/sea-level-uniform-z13.pmtiles \
            --header-json \
            > tmp/uniform-z13/pmtiles-header.json

          "$(go env GOPATH)/bin/go-pmtiles" show \
            tmp/uniform-z13/sea-level-uniform-z13.pmtiles \
            --metadata \
            > tmp/uniform-z13/pmtiles-metadata.json

          sha256sum tmp/uniform-z13/sea-level-uniform-z13.pmtiles \
            > tmp/uniform-z13/sha256.txt

          du -h tmp/uniform-z13/sea-level-uniform-z13.pmtiles

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: uniform-z13-fallback-western-netherlands
          path: |
            tmp/uniform-z13/config.json
            tmp/uniform-z13/preflight.json
            tmp/uniform-z13/work/grid.json
            tmp/uniform-z13/work/sea_mask.report.json
            tmp/uniform-z13/dem.log
            tmp/uniform-z13/flood.log
            tmp/uniform-z13/pyramid.log
            tmp/uniform-z13/pyramid-report.json
            tmp/uniform-z13/pmtiles-header.json
            tmp/uniform-z13/pmtiles-metadata.json
            tmp/uniform-z13/sha256.txt
            tmp/uniform-z13/sea-level-uniform-z13.pmtiles
          retention-days: 14

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-uniform-z13-fallback.yml
          git commit -m "Remove temporary uniform Z13 fallback workflow"
          git pull --rebase
          git push
